name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci
      - run: npm run test:e2e
      - run: npm run build
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-test-results-and-coverage
          path: |
            apps/web/reports/junit.xml
            apps/web/reports/e2e-junit.xml
            apps/web/reports/e2e-results/
            apps/web/coverage/web/
          if-no-files-found: warn
          retention-days: 14

  api:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: bash ./mvnw -B -ntp verify
      - name: Resolve optional PostgreSQL dependencies for offline scan
        run: bash ./mvnw -B -ntp -Ppostgres dependency:resolve
      - name: Scan dependency manifests with Trivy
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm --read-only --tmpfs /tmp:rw,size=256m \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/src,readonly \
            --mount type=bind,source="$RUNNER_TEMP/trivy-cache",target=/cache \
            --mount type=bind,source="$HOME/.m2/repository",target=/root/.m2/repository,readonly \
            ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            --cache-dir /cache fs --offline-scan --skip-check-update --include-dev-deps \
            --ignorefile /src/.trivyignore --scanners vuln --severity HIGH,CRITICAL \
            --exit-code 1 --no-progress /src
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-coverage
          path: |
            apps/api/target/surefire-reports/
            apps/api/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  api-postgres-integration:
    name: PostgreSQL integration checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: novelweb
          POSTGRES_USER: novelweb
          POSTGRES_PASSWORD: ci-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novelweb -d novelweb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/novelweb
      DATABASE_USERNAME: novelweb
      DATABASE_PASSWORD: ci-test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run PostgreSQL integration tests
        run: >-
          bash ./mvnw -B -ntp -Ppostgres
          -Dpostgres.integration=true
          -Dspring.profiles.active=postgres
          -Dtest=PostgresSchemaIntegrationTests verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: postgres-integration-test-reports
          path: |
            apps/api/target/surefire-reports/
            apps/api/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  openapi:
    name: OpenAPI contract checks
    runs-on: ubuntu-latest
    env:
      REDOCLY_TELEMETRY: off
    defaults:
      run:
        working-directory: tools/openapi
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/openapi/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high
      - name: Save base OpenAPI contract
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          spec='apps/api/src/main/resources/openapi.yaml'
          if git cat-file -e "${base}:${spec}" 2>/dev/null; then
            git show "${base}:${spec}" > "$RUNNER_TEMP/openapi-base.yaml"
            echo "OPENAPI_BASE_SPEC=$RUNNER_TEMP/openapi-base.yaml" >> "$GITHUB_ENV"
          else
            echo "No base OpenAPI file exists; this pull request introduces the initial contract."
          fi
      - name: Check OpenAPI version impact
        if: github.event_name == 'pull_request' && env.OPENAPI_BASE_SPEC != ''
        run: npm run diff -- "$OPENAPI_BASE_SPEC" ../../apps/api/src/main/resources/openapi.yaml --format=github-actions --fail-on=none --check-version

  dependency-review:
    name: Pull request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  secret-scan:
    name: Repository secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate vulnerability exceptions
        shell: pwsh
        run: ./tools/security/validate-trivy-ignores.ps1
      - name: Check scanner detection and redaction, then scan repository
        shell: pwsh
        run: ./tools/security/scan-secrets.ps1
