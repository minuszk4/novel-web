spring:
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/novelweb}
    username: ${DATABASE_USERNAME:novelweb}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: NovelWebPostgresPool
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:5}
      minimum-idle: 1
      connection-timeout: 3000
      validation-timeout: 1000
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

novel:
  auth:
    google:
      rate-limit-hmac-key: ${GOOGLE_AUTH_RATE_LIMIT_HMAC_KEY:}
      rate-limit-refill-interval: ${GOOGLE_AUTH_RATE_LIMIT_REFILL_INTERVAL:6s}
      trusted-proxies: ${GOOGLE_AUTH_TRUSTED_PROXIES:}
      firebase-api-key: ${FIREBASE_AUTH_API_KEY:}
      firebase-auth-domain: ${FIREBASE_AUTH_DOMAIN:}
      firebase-project-id: ${FIREBASE_AUTH_PROJECT_ID:}
      firebase-app-id: ${FIREBASE_AUTH_APP_ID:}
  identity:
    session:
      absolute-ttl: ${NOVEL_SESSION_ABSOLUTE_TTL:30d}
      idle-ttl: ${NOVEL_SESSION_IDLE_TTL:7d}
      touch-interval: ${NOVEL_SESSION_TOUCH_INTERVAL:5m}
    logout-all:
      confirmation-ttl: ${NOVEL_LOGOUT_ALL_CONFIRMATION_TTL:5m}
  library:
    cursor:
      hmac-key: ${NOVEL_LIBRARY_CURSOR_HMAC_KEY:}
  security:
    csrf:
      hmac-key: ${NOVEL_CSRF_HMAC_KEY:}
