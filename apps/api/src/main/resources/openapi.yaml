          maxLength: 512
        targetTerm:
          type: [string, 'null']
          maxLength: 4096
        aliases:
          type: array
          maxItems: 25
          items:
            type: string
            maxLength: 512
        scope:
          type: string
          enum: [USER_GLOBAL, LIBRARY, WORK, VOLUME, CHAPTER]
        priority:
