          type: string
          format: uuid
        submissionId:
          type: string
          format: uuid
        actionCode:
          type: string
          enum: [ACCEPT, REJECT]
        reasonCode:
          type: [string, 'null']
          enum: [ACCURATE, MINOR_TERMINOLOGY_ISSUE, MISSING_CONTENT, MEANING_ERROR, TERMINOLOGY_ERROR, FORMATTING_ERROR, OTHER, null]
        snapshotDigest:
          type: string
          pattern: '^[a-f0-9]{64}$'
        decidedAt:
          type: string
          format: date-time
        replayed:
          type: boolean
