  /api/v1/translation/jobs/{jobId}:
    get:
      operationId: getTranslationJobStatus
      tags: [Translation]
      x-implementation-status: local-preview
      summary: Read translation job progress metadata
      description: >-
        Returns only identifiers, whether the job source is still the current ready chapter revision, authorized
        work/chapter titles and ordinal, a writer-action capability flag,
        language pair, stable state/failure code, unit counters and candidate status; source and translated text
        are never returned. Requires readable access to the containing library and current Terms/Privacy
        acceptance. Responses are no-store. Active jobs include Retry-After: 2 for polling.
      security:
        - appSession: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Private progress metadata for the accessible job.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationJobStatusResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/translation/jobs/{jobId}/candidate:
    get:
      operationId: getFakeLocalTranslationCandidatePreview
      tags: [Translation]
      x-implementation-status: local-preview
      summary: Read one bounded source and fake-result candidate page
      description: >-
        Returns paired source and visibly fake-local identity-style result segments only when the actor has
        write access to the containing library, the job is fake-local and review-required, the candidate is
        ready-for-review, and its exact source revision/hash remains current. This is a preview only: it does
        not accept/reject, edit, publish or grant Reader access. Pages contain at most 25 segments and are
        capped to limit response size. Responses are no-store; fake-local content is not a usable translation.
      security:
        - appSession: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 5000
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 20
      responses:
        '200':
          description: One bounded page of a current, unpublished fake-local candidate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationCandidatePreviewResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/translation/jobs/{jobId}/candidate/segments/{sourceSegmentId}/edit:
    put:
      operationId: saveFakeLocalCandidateSegmentEdit
      tags: [Translation]
      x-implementation-status: local-preview
      summary: Append a private writer correction to one fake candidate segment
      description: >-
        Appends a private immutable edit revision for one segment of the current complete fake-local candidate.
        Requires current session policy, CSRF, writable-library access, exact current source snapshot, If-Match
        using the current edit ETag, and an Idempotency-Key. The generated result remains unchanged; the correction
        does not approve or publish the candidate, grant Reader access or call an external translation provider.
        Text is plain text, bounded to 1 MiB UTF-8 and responses are no-store.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: sourceSegmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            pattern: '^"edit-(0|[1-9][0-9]*)"$'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9._~-]{16,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [translatedText]
              properties:
                translatedText:
                  type: string
                  minLength: 1
                  maxLength: 1048576
                  description: Plain text; server enforces a maximum of 1 MiB after UTF-8 encoding.
      responses:
        '201':
          description: A new immutable candidate segment edit revision was saved.
          headers:
            ETag:
              schema:
                type: string
                pattern: '^"edit-(0|[1-9][0-9]*)"$'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationCandidateEditResponse'
        '200':
          description: The original result for an exact idempotent replay.
          headers:
            ETag:
              schema:
                type: string
                pattern: '^"edit-(0|[1-9][0-9]*)"$'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationCandidateEditResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/translation/jobs/{jobId}/retry:
    post:
      operationId: retryFailedTranslationJob
      tags: [Translation]
      x-implementation-status: local-preview
      summary: Retry remaining eligible fake-local units
      description: >-
        Requeues failed units below their attempt ceiling only when the source revision/hash is still current.
        Workspace owners/admins/editors and personal-library owners may act; readers and unrelated users receive
        the same not-found response. A raw idempotency key is never persisted. Session-bound CSRF and current
        Terms/Privacy acceptance are required. This operation cannot dispatch a real external provider.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9._~-]{16,128}$'
      responses:
        '202':
          description: Eligible units were queued for another local attempt.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationRetryResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/translation/jobs/{jobId}/cancel:
    post:
      operationId: cancelFakeLocalTranslationJob
      tags: [Translation]
      x-implementation-status: local-preview
      summary: Cancel active fake-local translation work
      description: >-
        Atomically cancels queued/running/retry-wait units, ends fake-local running attempts and clears leases.
        A late worker completion is fenced before candidate writes. If completion wins the row lock first and the
        job reaches review_required, cancellation is rejected. Real provider cancellation/refund is not supported.
        Requires writable library access, current Terms/Privacy acceptance and session-bound CSRF.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9._~-]{16,128}$'
      responses:
        '200':
          description: The active local job was cancelled or the same cancellation was replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationCancelResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    appSession:
      type: apiKey
      in: cookie
      name: __Host-novel_session
      description: Opaque, rotated, host-only session cookie with Secure, HttpOnly, SameSite=Lax and Path=/ attributes.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Short-lived synchronizer token returned by GET /api/v1/auth/csrf; held by the browser in memory.
  headers:
    ReaderAnnotationETag:
      description: Strong entity tag derived from the annotation version; send it verbatim in If-Match for updates.
      schema:
        type: string
        pattern: '^"annotation-[1-9][0-9]*"$'
  schemas:
    CreateManuscriptRequest:
      type: object
      additionalProperties: false
      required: [title, language]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        author:
          type: string
          maxLength: 200
          default: ''
        language:
          type: string
          minLength: 2
          maxLength: 35
          example: vi
    CreateDraftChapterRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
          description: Trimmed by the server; Unicode code point count must be 1–300.
    CreatedDraftChapter:
      type: object
      additionalProperties: false
      required: [id, workId, ordinal, title, language, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workId:
          type: string
          format: uuid
        ordinal:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 300
        language:
          type: string
          minLength: 2
          maxLength: 35
        status:
          type: string
          const: draft
        createdAt:
          type: string
          format: date-time
    AuthoringChapterOutlinePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AuthoringChapterOutlineItem'
        nextCursor:
          type: [string, 'null']
          maxLength: 2048
          description: Signed actor/manuscript/endpoint cursor, or null when there is no next page.
    AuthoringManuscriptListPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AuthoringManuscriptListItem'
        nextCursor:
          type: [string, 'null']
          maxLength: 2048
          description: Signed actor/endpoint cursor, or null when there is no next page.
    AuthoringManuscriptListItem:
      type: object
      additionalProperties: false
      required: [id, title, author, language, visibility, publicationState, chapterCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 300
        author:
          type: string
          maxLength: 200
        language:
          type: string
          minLength: 2
          maxLength: 35
        visibility:
          type: string
          const: private
        publicationState:
          type: string
          const: draft
        chapterCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    AuthoringManuscriptDetails:
      type: object
      additionalProperties: false
      required:
        [id, title, author, language, visibility, publicationState, chapterCount, createdAt, metadataVersion]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 300
        author:
          type: string
          maxLength: 200
        language:
          type: string
          minLength: 2
          maxLength: 35
        visibility:
          type: string
          const: private
        publicationState:
          type: string
          const: draft
        chapterCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        metadataVersion:
          type: integer
          format: int64
          minimum: 1
    AuthoringManuscriptMetadataUpdate:
      type: object
      additionalProperties: false
      required: [title, author, language]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
          description: Trimmed by the server; Unicode code point count must be 1–300.
        author:
          type: string
          maxLength: 200
          description: Empty string clears the optional pen name/byline.
        language:
          type: string
          minLength: 2
          maxLength: 35
    AuthoringChapterOutlineItem:
      type: object
      additionalProperties: false
      required: [id, ordinal, title, language, status, contentAvailable, hasSavedDraftContent, createdAt]
      properties:
        id:
          type: string
          format: uuid
        ordinal:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 300
        language:
          type: string
          minLength: 2
          maxLength: 35
        status:
          type: string
          enum: [draft, ready, unavailable]
        contentAvailable:
          type: boolean
          description: True only when a ready chapter has a current source revision; authored drafts can have saved revisions and remain false.
        hasSavedDraftContent:
          type: boolean
          description: True when this draft has a saved revision; only a never-saved empty draft can be removed from the outline.
        createdAt:
          type: string
          format: date-time
    SavePrivateDraftRevisionRequest:
      type: object
      additionalProperties: false
      required: [sourceFormat, normalizedContent, segments]
      properties:
        sourceFormat:
          type: string
          enum: [plain_text, markdown, xhtml, epub_xhtml]
        normalizedContent:
          type: string
          minLength: 1
          maxLength: 10485760
          description: Complete normalized chapter body; maximum 10 MiB when encoded as UTF-8.
        segments:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/PrivateDraftSegmentInput'
    PrivateDraftSegmentInput:
      type: object
      additionalProperties: false
      required: [ordinal, type, sourceText, stableAnchor]
      properties:
        ordinal:
          type: integer
          minimum: 1
          description: Must be contiguous and begin at one.
        type:
          type: string
          enum: [paragraph, heading, quote, image_ref]
        sourceText:
          type: string
          maxLength: 1048576
          description: Maximum 1 MiB UTF-8 per segment and 10 MiB across all segments.
        stableAnchor:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$'
    PrivateAuthoredDraft:
      type: object
      additionalProperties: false
      required: [id, workId, title, status, revisionNo, sourceFormat, normalizedContent, segments, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 300
        status:
          type: string
          const: draft
        revisionNo:
          type: integer
          minimum: 0
        sourceFormat:
          type: [string, 'null']
          enum: [plain_text, markdown, xhtml, epub_xhtml, null]
        normalizedContent:
          type: string
          maxLength: 10485760
        segments:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/PrivateDraftSegment'
        updatedAt:
          type: string
          format: date-time
    PrivateDraftSegment:
      allOf:
        - $ref: '#/components/schemas/PrivateDraftSegmentInput'
      description: Owner-visible segment snapshot; checksum and internal revision identifiers are omitted.
    CreatedPrivateDraftRevision:
      type: object
      additionalProperties: false
      required: [id, chapterId, revisionNo, sourceFormat, createdAt]
      properties:
        id:
          type: string
          format: uuid
        chapterId:
          type: string
          format: uuid
        revisionNo:
          type: integer
          minimum: 1
        sourceFormat:
          type: string
          enum: [plain_text, markdown, xhtml, epub_xhtml]
        createdAt:
          type: string
          format: date-time
    CreatedManuscript:
      type: object
      additionalProperties: false
      required: [id, title, author, language, publicationState, visibility, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 300
        author:
          type: string
          maxLength: 200
        language:
          type: string
          maxLength: 35
        publicationState:
          type: string
          const: draft
        visibility:
          type: string
          const: private
        createdAt:
          type: string
          format: date-time
    TranslationEnqueueRequest:
      type: object
      additionalProperties: false
      required: [chapterId, sourceRevisionId, targetLanguage]
      properties:
        chapterId:
          type: string
          format: uuid
        sourceRevisionId:
          type: string
          format: uuid
        targetLanguage:
          type: string
          minLength: 2
          maxLength: 35
          example: en
    TranslationEnqueueResponse:
      type: object
      additionalProperties: false
      required: [jobId, status, chapterId, sourceRevisionId, sourceLanguage, targetLanguage, providerId, totalUnits, replayed]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, preparing, translating, retry_wait, review_required, completed, failed, cancel_requested, cancelled]
        chapterId:
          type: string
          format: uuid
        sourceRevisionId:
          type: string
          format: uuid
        sourceLanguage:
          type: string
        targetLanguage:
          type: string
        providerId:
          type: string
          const: fake-local
        totalUnits:
          type: integer
          minimum: 1
        replayed:
          type: boolean
    TranslationJobStatusResponse:
      type: object
      additionalProperties: false
      required: [job, terminalUnits, progressPercent]
      properties:
        terminalUnits:
          type: integer
          minimum: 0
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
        job:
          type: object
          additionalProperties: false
          required: [id, workId, chapterId, sourceRevisionId, sourceRevisionCurrent, workTitle, chapterTitle, chapterOrdinal, canManage, sourceLanguage, targetLanguage, providerId, status, totalUnits, completedUnits, failedUnits, queuedUnits, runningUnits, retryWaitUnits, cancelledUnits, failureCode, candidateId, candidateStatus, createdAt, updatedAt, startedAt, completedAt, cancelRequestedAt]
          properties:
            id:
              type: string
              format: uuid
            workId:
              type: string
              format: uuid
            chapterId:
              type: string
              format: uuid
            sourceRevisionId:
              type: string
              format: uuid
            sourceRevisionCurrent:
              type: boolean
              description: True only when the job's source revision is the chapter's current ready revision. A stale revision must not be retried.
            workTitle:
              type: string
            chapterTitle:
              type: string
            chapterOrdinal:
              type: integer
              minimum: 1
            canManage:
              type: boolean
            sourceLanguage:
              type: string
            targetLanguage:
              type: string
            providerId:
              type: string
              const: fake-local
            status:
              type: string
              enum: [queued, preparing, translating, validating, retry_wait, review_required, completed, failed, cancel_requested, cancelled]
            totalUnits:
              type: integer
              minimum: 0
            completedUnits:
              type: integer
              minimum: 0
            failedUnits:
              type: integer
              minimum: 0
            queuedUnits:
              type: integer
              minimum: 0
            runningUnits:
              type: integer
              minimum: 0
            retryWaitUnits:
              type: integer
              minimum: 0
            cancelledUnits:
              type: integer
              minimum: 0
            failureCode:
              type: [string, 'null']
            candidateId:
              type: [string, 'null']
              format: uuid
            candidateStatus:
              anyOf:
                - type: string
                  enum: [assembling, partial, ready_for_review, rejected, published, superseded, stale]
                - type: 'null'
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            startedAt:
              type: [string, 'null']
              format: date-time
            completedAt:
              type: [string, 'null']
              format: date-time
            cancelRequestedAt:
              type: [string, 'null']
              format: date-time
    TranslationJobListResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/TranslationJobStatusResponse'
        nextCursor:
          type: [string, 'null']
          maxLength: 256
    TranslationCandidatePreviewResponse:
      type: object
      additionalProperties: false
      required: [jobId, candidateId, sourceRevisionId, sourceRevisionCurrent, sourceLanguage, targetLanguage, providerId, candidateStatus, pageOffset, pageLimit, totalSegments, segments]
      properties:
        jobId:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        sourceRevisionId:
          type: string
          format: uuid
        sourceRevisionCurrent:
          type: boolean
          const: true
        sourceLanguage:
          type: string
        targetLanguage:
          type: string
        providerId:
          type: string
          const: fake-local
        candidateStatus:
          type: string
          const: ready_for_review
        pageOffset:
          type: integer
          minimum: 0
          maximum: 5000
        pageLimit:
          type: integer
          minimum: 1
          maximum: 25
        totalSegments:
          type: integer
          minimum: 1
          maximum: 5000
        segments:
          type: array
          maxItems: 25
          items:
            type: object
            additionalProperties: false
            required: [sourceSegmentId, ordinal, sourceType, sourceText, fakeResultText, editedText, editRevision, editEtag]
            properties:
              sourceSegmentId:
                type: string
                format: uuid
              ordinal:
                type: integer
                minimum: 1
                maximum: 5000
              sourceType:
                type: string
                enum: [paragraph, heading, quote]
              sourceText:
                type: string
                maxLength: 4000
              fakeResultText:
                type: string
                maxLength: 4016
                description: Identity-style source echo prefixed with an explicit fake-local marker; never a usable translation.
              editedText:
                type: [string, 'null']
                maxLength: 1048576
                description: Latest private writer correction, if one exists; never changes fakeResultText.
              editRevision:
                type: integer
                minimum: 0
                description: Zero means no writer correction has been saved.
              editEtag:
                type: string
                pattern: '^"edit-(0|[1-9][0-9]*)"$'
    TranslationCandidateEditResponse:
      type: object
      additionalProperties: false
      required: [jobId, candidateId, sourceSegmentId, editRevision, translatedText, createdAt, replayed]
      properties:
        jobId:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        sourceSegmentId:
          type: string
          format: uuid
        editRevision:
          type: integer
          minimum: 1
        translatedText:
          type: string
          maxLength: 1048576
          description: Plain text bounded by UTF-8 bytes at runtime.
        createdAt:
          type: string
          format: date-time
        replayed:
          type: boolean
    TranslationRetryResponse:
      type: object
      additionalProperties: false
      required: [jobId, jobStatus, retriedUnits, replayed, outboxEventId]
      properties:
        jobId:
          type: string
          format: uuid
        jobStatus:
          type: string
        retriedUnits:
          type: integer
          minimum: 0
        replayed:
          type: boolean
        outboxEventId:
          type: string
          format: uuid
    TranslationCancelResponse:
      type: object
      additionalProperties: false
      required: [jobId, jobStatus, cancelledUnits, cancelledAttempts, replayed, outboxEventId]
      properties:
        jobId:
          type: string
          format: uuid
        jobStatus:
          type: string
        cancelledUnits:
          type: integer
          minimum: 0
        cancelledAttempts:
          type: integer
          minimum: 0
        replayed:
          type: boolean
        outboxEventId:
          type: string
          format: uuid
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
        groups:
          type: array
          description: Health groups included by Spring Boot Actuator; component details are hidden.
          items:
            type: string
    ApiSystemStatus:
      type: object
      required: [apiVersion, environment, integrations, features]
      properties:
        apiVersion:
          type: string
          const: v1
        environment:
          type: string
          example: local
        integrations:
          type: object
          required: [googleOidcEnabled, momoTestEnabled, momoEnvironment]
          properties:
            googleOidcEnabled:
              type: boolean
              description: >-
                True when a plausible Google web client ID, secure credential callback URI, and
                32-byte rate-limit HMAC key are configured. This reports local configuration
                readiness; it does not verify reachability or credentials with Google.
            momoTestEnabled:
              type: boolean
              const: false
            momoEnvironment:
              type: string
              const: TEST
        features:
          type: object
          required: [importProcessingEnabled, cultivationEnabled, commerceSandboxEnabled, translationFakePreviewEnabled]
          properties:
            importProcessingEnabled:
              type: boolean
              const: false
            cultivationEnabled:
              type: boolean
              const: false
            commerceSandboxEnabled:
              type: boolean
              const: false
            translationFakePreviewEnabled:
              type: boolean
              description: True only when the postgres and translation-fake profiles and provider, API and worker opt-in flags are active.
    GoogleSignInBootstrap:
      type: object
      additionalProperties: false
      required: [clientId, loginUri, nonce, locale, attemptExpiresAt]
      properties:
        clientId:
          type: string
          description: Public Google Identity Services web client ID for this environment.
        loginUri:
          type: string
          format: uri
          description: Fixed backend callback URI; never supplied by the browser.
        nonce:
          type: string
          minLength: 16
          description: One-use nonce bound to the server-side sign-in attempt.
        locale:
          type: string
          example: vi
        attemptExpiresAt:
          type: string
          format: date-time
    GoogleCredentialForm:
      type: object
      additionalProperties: true
      required: [credential, g_csrf_token]
      properties:
        credential:
          type: string
          minLength: 1
          maxLength: 16384
          description: Google ID-token credential posted directly by GIS; discard after validation.
        g_csrf_token:
          type: string
          minLength: 1
          maxLength: 512
          description: Must exactly match the g_csrf_token cookie.
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token, expiresAt]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: HMAC-derived token bound to the current opaque app session; keep in memory only.
        expiresAt:
          type: string
          format: date-time
          description: Absolute session-expiry upper bound; idle session expiry can occur earlier.
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [user, identityProviders, policy, roles, features]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        identityProviders:
          type: array
          items:
            type: string
            enum: [google]
        policy:
          $ref: '#/components/schemas/UserPolicyState'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleScope'
        features:
          $ref: '#/components/schemas/UserFeatureFlags'
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, displayName, status]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        contactEmail:
          type: [string, 'null']
          format: email
        avatarUrl:
          type: [string, 'null']
          format: uri
        status:
          type: string
          enum: [active, pending, suspended]
    UserPolicyState:
      type: object
      additionalProperties: false
      required: [termsAcceptedVersion, privacyNoticeAcknowledgedVersion, requiredAcceptanceComplete]
      properties:
        termsAcceptedVersion:
          type: [string, 'null']
        privacyNoticeAcknowledgedVersion:
          type: [string, 'null']
        requiredAcceptanceComplete:
          type: boolean
    RoleScope:
      type: object
      additionalProperties: false
      required: [scope, permissions]
      properties:
        scope:
          type: string
          maxLength: 128
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            maxLength: 128
    UserFeatureFlags:
      type: object
      additionalProperties: false
      required: [privateLibraryEnabled, importEnabled, readerEnabled, cultivationEnabled, commerceSandboxEnabled]
      properties:
        privateLibraryEnabled:
          type: boolean
        importEnabled:
          type: boolean
        readerEnabled:
          type: boolean
        cultivationEnabled:
          type: boolean
        commerceSandboxEnabled:
          type: boolean
    CurrentPoliciesResponse:
      type: object
      additionalProperties: false
      required: [terms, privacyNotice]
      properties:
        terms:
          $ref: '#/components/schemas/PolicyDocument'
        privacyNotice:
          $ref: '#/components/schemas/PolicyDocument'
    PolicyDocument:
      type: object
      additionalProperties: false
      required: [version, effectiveAt, documentUrl]
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
        effectiveAt:
          type: string
          format: date-time
        documentUrl:
          type: string
          format: uri-reference
          description: Same-origin URL only.
    PolicyAcceptanceRequest:
      type: object
      additionalProperties: false
      required: [termsVersion, privacyNoticeVersion, termsAccepted, privacyNoticeAcknowledged]
      properties:
        termsVersion:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
        privacyNoticeVersion:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
        termsAccepted:
          type: boolean
          const: true
        privacyNoticeAcknowledged:
          type: boolean
          const: true
    PolicyVersion:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
    PolicyAcceptanceResponse:
      type: object
      additionalProperties: false
      required: [termsAcceptedVersion, termsAcceptedAt, privacyNoticeAcknowledgedVersion, privacyNoticeAcknowledgedAt]
      properties:
        termsAcceptedVersion:
          type: string
        termsAcceptedAt:
          type: string
          format: date-time
        privacyNoticeAcknowledgedVersion:
          type: string
        privacyNoticeAcknowledgedAt:
          type: string
          format: date-time
    SessionListResponse:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionSummary'
    SessionSummary:
      type: object
      additionalProperties: false
      required: [id, deviceSummary, createdAt, lastSeenAt, expiresAt, current]
      properties:
        id:
          type: string
          maxLength: 128
          description: Opaque identifier for revocation; not the session secret.
        deviceSummary:
          type: string
          maxLength: 160
          description: Coarse browser/device label; no raw IP address.
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
    LogoutAllRequest:
      type: object
      additionalProperties: false
      required: [confirmationToken]
      properties:
        confirmationToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Five-minute one-use server-issued token bound to the current user and session.
    LogoutAllConfirmationResponse:
      type: object
      additionalProperties: false
      required: [confirmationToken, expiresAt]
      properties:
        confirmationToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: 256-bit token; keep in memory only and send only to the logout-all endpoint.
        expiresAt:
          type: string
          format: date-time
    LibrarySummary:
      type: object
      additionalProperties: false
      required: [id, name, visibility, isDefault, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        visibility:
          type: string
          const: private
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
    LibraryListResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LibrarySummary'
        nextCursor:
          type: [string, 'null']
          maxLength: 2048
          description: Opaque HMAC-signed cursor bound to the current user and stable sort; null when no next page exists.
    WorkSummary:
      type: object
      additionalProperties: false
      required: [id, libraryId, title, author, language, visibility, chapterCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        libraryId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 300
        author:
          type: string
          maxLength: 200
        language:
          type: string
          maxLength: 35
        visibility:
          type: string
          const: private
        chapterCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        lastReadAt:
          type: [string, 'null']
          format: date-time
    WorkListResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/WorkSummary'
        nextCursor:
          type: [string, 'null']
          maxLength: 2048
          description: Opaque HMAC-signed cursor bound to owner, library, q, tag, status and stable sort; null when no next page exists.
    LibraryCollectionSummary:
      type: object
      additionalProperties: false
      required: [id, name, workCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 40
        workCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LibraryCollectionListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/LibraryCollectionSummary'
    CreateLibraryCollectionRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^.*\S.*$'
    LibraryWorkState:
      type: object
      additionalProperties: false
      required: [workId, readingStatus, collectionIds, version, updatedAt]
      properties:
        workId:
          type: string
          format: uuid
        readingStatus:
          type: string
          enum: [reading, want-to-read, paused, completed, dropped]
        collectionIds:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            type: string
            format: uuid
        version:
          type: integer
          minimum: 0
        updatedAt:
          type: [string, 'null']
          format: date-time
          description: Null until the first state update is saved.
    ReplaceLibraryWorkStateRequest:
      type: object
      additionalProperties: false
      required: [readingStatus, collectionIds]
      properties:
        readingStatus:
          type: string
          enum: [reading, want-to-read, paused, completed, dropped]
        collectionIds:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            type: string
            format: uuid
    LibraryStateVersionConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [latest]
          properties:
            latest:
              $ref: '#/components/schemas/LibraryWorkState'
    ReaderManifest:
      type: object
      additionalProperties: false
      required: [work, sourceLanguage, chapters, nextCursor]
      properties:
        work:
          $ref: '#/components/schemas/WorkSummary'
        sourceLanguage:
          type: string
          maxLength: 35
        chapters:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReaderChapterSummary'
        nextCursor:
          type: [string, 'null']
          maxLength: 2048
          description: Opaque cursor bound to work and chapter order.
    ReaderChapterSummary:
      type: object
      additionalProperties: false
      required: [id, ordinal, title, accessState]
      properties:
        id:
          type: string
          format: uuid
        ordinal:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 300
        accessState:
          type: string
          enum: [readable, preview, locked, owned, unavailable]
    ChapterContent:
      type: object
      additionalProperties: false
      required: [chapterId, workId, sourceRevisionId, sourceLanguage, segments, nextSegmentCursor]
      properties:
        chapterId:
          type: string
          format: uuid
        workId:
          type: string
          format: uuid
        sourceRevisionId:
          type: string
          format: uuid
        sourceLanguage:
          type: string
          maxLength: 35
        segments:
          type: array
          maxItems: 1000
          description: Sanitized semantic source text; raw HTML and executable markup are never returned.
          items:
            $ref: '#/components/schemas/SourceSegment'
        nextSegmentCursor:
          type: [string, 'null']
          maxLength: 2048
          description: Opaque cursor for the next source segment batch.
    SourceSegment:
      type: object
      additionalProperties: false
      required: [anchor, type, sourceText]
      properties:
        anchor:
          type: string
          minLength: 1
          maxLength: 160
        type:
          type: string
          enum: [heading, paragraph, quote]
        sourceText:
          type: string
          maxLength: 20000
    ImportRightsStatement:
      type: object
      additionalProperties: false
      required: [version, effectiveAt, displayText]
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 64
        effectiveAt:
          type: string
          format: date-time
        displayText:
          type: string
          minLength: 1
          maxLength: 8000
          description: Exact approved statement shown before any file bytes are uploaded or processed.
    ImportRightsAcceptanceRequest:
      type: object
      additionalProperties: false
      required: [statementVersion, confirmed]
      properties:
        statementVersion:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
          maxLength: 64
        confirmed:
          type: boolean
          const: true
    ImportRightsAcceptance:
      type: object
      additionalProperties: false
      required: [id, statementVersion, acceptedAt, statementSha256]
      properties:
        id:
          type: string
          format: uuid
        statementVersion:
          type: string
          maxLength: 64
        acceptedAt:
          type: string
          format: date-time
        statementSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 of the exact UTF-8 display text acknowledged by the caller.
    CreateImportRequest:
      type: object
      additionalProperties: false
      required: [libraryId, source, rightsAcceptanceId, rightsStatementVersion, rightsConfirmed]
      properties:
        libraryId:
          type: string
          format: uuid
        rightsAcceptanceId:
          type: string
          format: uuid
          description: One-time actor-bound receipt from POST /imports/rights-statement/acceptance; consumed atomically when the import job is created.
        source:
          $ref: '#/components/schemas/ImportSourceDescriptor'
        rightsStatementVersion:
          type: string
          minLength: 1
          maxLength: 64
        rightsConfirmed:
          type: boolean
          const: true
    ImportSourceDescriptor:
      type: object
      additionalProperties: false
      required: [kind, filename, contentType, sizeBytes]
      properties:
        kind:
          type: string
          const: upload
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: Display metadata only; not trusted as a path or file type.
        contentType:
          type: [string, 'null']
          maxLength: 160
          description: Browser-declared MIME hint; Markdown accepts text/markdown, text/x-markdown, text/plain or application/octet-stream, and all hints are checked against the file extension and bytes.
        sizeBytes:
          type: integer
          minimum: 1
          description: Declared size hint; the server enforces the configured cap and exact streamed byte count.
    ImportUploadTarget:
      type: object
      additionalProperties: false
      required: [method, url, headers, expiresAt]
      properties:
        method:
          type: string
          const: PUT
        url:
          type: string
          format: uri-reference
          description: Short-lived same-origin API path for the private upload target; do not log or persist the one-time token in headers.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Exact headers required by the API upload target, including the one-time token.
        expiresAt:
          type: string
          format: date-time
    ImportCreatedResponse:
      type: object
      additionalProperties: false
      required: [job, uploadTarget]
      properties:
        job:
          $ref: '#/components/schemas/ImportJob'
        uploadTarget:
          $ref: '#/components/schemas/ImportUploadTarget'
    ImportJob:
      type: object
      additionalProperties: false
      required: [id, status, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [upload_pending, uploaded, queued, scanning, parsing, ready_to_commit, committed, failed, cancelled, expired]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        warnings:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ImportWarning'
        failureCode:
          type: [string, 'null']
          maxLength: 96
        previewSummary:
          $ref: '#/components/schemas/ImportPreviewSummary'
    ImportWarning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          maxLength: 96
        message:
          type: string
          maxLength: 500
          description: Safe actionable text; never includes chapter body or raw parser internals.
    ImportPreviewSummary:
      type: object
      additionalProperties: false
      required: [title, author, chapterCount]
      properties:
        title:
          type: string
          maxLength: 300
        author:
          type: [string, 'null']
          maxLength: 200
        chapterCount:
          type: integer
          minimum: 0
    ImportPreview:
      type: object
      additionalProperties: false
      required: [importId, version, title, author, chapterCount, language, chapters, nextCursor, warnings]
      properties:
        importId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 300
        author:
          type: string
          maxLength: 200
        chapterCount:
          type: integer
          minimum: 0
        language:
          type: string
          maxLength: 35
        chapters:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ImportChapterPreview'
        nextCursor:
          type: [string, 'null']
          maxLength: 2048
        warnings:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ImportWarning'
    ImportChapterPreview:
      type: object
      additionalProperties: false
      required: [id, ordinal, title]
      properties:
        id:
          type: string
          format: uuid
        ordinal:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 300
    ImportPreviewPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        author:
          type: string
          maxLength: 200
        language:
          type: string
          maxLength: 35
        chapterOrder:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
    CultivationSettingsRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Explicit user opt-in; false pauses future progression without deleting earned history.
    CultivationActivityPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CultivationDailyActivity'
        nextCursor:
          anyOf:
            - type: string
              maxLength: 256
            - type: 'null'
          description: Signed cursor for the next older date, or null when no older rows remain.
    CultivationDailyActivity:
      type: object
      additionalProperties: false
      required: [activityDate, xpEarned]
      properties:
        activityDate:
          type: string
          format: date
          description: UTC date on which XP was recorded.
        xpEarned:
          type: integer
          format: int64
          minimum: 1
          description: XP earned on this UTC date; no story or chapter metadata is included.
    CultivationReadingSessionStartRequest:
      type: object
      additionalProperties: false
      required: [workId, chapterId, active]
      properties:
        workId:
          type: string
          format: uuid
        chapterId:
          type: string
          format: uuid
        active:
          type: boolean
          const: true
          description: Browser visibility/focus signal; the server does not trust client duration or timestamps.
    CultivationReadingSessionHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [sequence, active]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
          description: Consecutive client event number; gaps and stale sequence values return 409.
        active:
          type: boolean
          description: False pauses elapsed time when the Reader is hidden or blurred.
    CultivationReadingSessionStart:
      type: object
      additionalProperties: false
      required: [sessionId, state, startedAt, expiresAt, lastSequence, totalActiveSeconds, heartbeatIntervalSeconds, idleTimeoutSeconds]
      properties:
        sessionId:
          type: string
          format: uuid
        state:
          type: string
          const: active
        startedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastSequence:
          type: integer
          format: int64
          const: 0
        totalActiveSeconds:
          type: integer
          format: int64
          const: 0
        heartbeatIntervalSeconds:
          type: integer
          const: 30
        idleTimeoutSeconds:
          type: integer
          const: 90
    CultivationReadingSessionHeartbeat:
      type: object
      additionalProperties: false
      required: [sessionId, state, sequence, creditedSeconds, totalActiveSeconds, awardedXp, receivedAt, expiresAt]
      properties:
        sessionId:
          type: string
          format: uuid
        state:
          type: string
          const: active
        sequence:
          type: integer
          format: int64
        creditedSeconds:
          type: integer
          minimum: 0
          maximum: 60
        totalActiveSeconds:
          type: integer
          format: int64
          minimum: 0
        awardedXp:
          type: integer
          minimum: 0
          maximum: 120
          description: XP atomically posted by this accepted heartbeat; idempotent replays return the same award.
        receivedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    CultivationReadingSessionClose:
      type: object
      additionalProperties: false
      required: [sessionId, state, startedAt, closedAt, totalActiveSeconds, lastSequence, awardedXp]
      properties:
        sessionId:
          type: string
          format: uuid
        state:
          type: string
          enum: [closed, expired, revoked]
        startedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
        totalActiveSeconds:
          type: integer
          format: int64
          minimum: 0
        lastSequence:
          type: integer
          format: int64
          minimum: 0
        awardedXp:
          type: integer
          minimum: 0
          maximum: 120
          description: XP posted for the final eligible active interval when this session was closed.
    CultivationState:
      type: object
      additionalProperties: false
      required:
        [enabled, profileVersion, totalXp, todayXpEarned, currentRank, nextRank, xpToNextRank, progressRatio, rankCatalogVersion, policyVersion, locale, xpPerActiveMinute, dailyXpCap, nextDailyResetAt, rankCatalog]
      properties:
        enabled:
          type: boolean
        profileVersion:
          type: integer
          format: int64
          minimum: 0
          description: Zero represents a not-yet-created profile; repeated settings do not increment this version.
        totalXp:
          type: integer
          format: int64
          minimum: 0
        todayXpEarned:
          type: integer
          format: int64
          minimum: 0
          description: XP already posted to the immutable ledger for the current UTC date; the approved policy cap is 120.
        currentRank:
          $ref: '#/components/schemas/CultivationRank'
        nextRank:
          anyOf:
            - $ref: '#/components/schemas/CultivationRank'
            - type: 'null'
        xpToNextRank:
          type: integer
          format: int64
          minimum: 0
        progressRatio:
          type: number
          minimum: 0
          maximum: 1
        rankCatalogVersion:
          type: string
          maxLength: 32
        policyVersion:
          type: string
          maxLength: 32
        locale:
          type: string
          const: vi-VN
        xpPerActiveMinute:
          type: integer
          minimum: 1
        dailyXpCap:
          type: integer
          minimum: 1
        nextDailyResetAt:
          type: string
          format: date-time
          description: Next midnight UTC; display this exact server timestamp for the daily reset.
        rankCatalog:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CultivationRank'
    CultivationRank:
      type: object
      additionalProperties: false
      required: [key, group, name, thresholdXp, sortOrder]
      properties:
        key:
          type: string
          maxLength: 48
        group:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 100
        thresholdXp:
          type: integer
          format: int64
          minimum: 0
        sortOrder:
          type: integer
          minimum: 0
    CreditBalance:
      type: object
      additionalProperties: false
      required: [paidCredits, bonusCredits, totalCredits, asOf]
      properties:
        paidCredits:
          type: integer
          minimum: 0
          description: Available non-expiring paid credits.
        bonusCredits:
          type: integer
          minimum: 0
          description: Available bonus credits, excluding tranches expired at asOf.
        totalCredits:
          type: integer
          minimum: 0
          description: Sum of paidCredits and bonusCredits.
        asOf:
          type: string
          format: date-time
          description: Database snapshot time used to determine bonus-credit expiry.
    CreditHistoryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CreditTransaction'
        nextCursor:
          type: [string, 'null']
          maxLength: 256
          description: Actor-bound signed keyset cursor, or null when there is no next page.
    CreditTransaction:
      type: object
      additionalProperties: false
      required: [id, entryType, bucket, amountDelta, expiresAt, sourceType, occurredAt]
      properties:
        id:
          type: string
          format: uuid
          description: Opaque ledger-entry identifier.
        entryType:
          type: string
          enum: [TOP_UP, BONUS_GRANT, UNLOCK_DEBIT, ADJUSTMENT, REVERSAL]
        bucket:
          type: string
          enum: [PAID, BONUS]
        amountDelta:
          type: integer
          format: int64
          description: Signed credit change; positive adds credits and negative consumes or reverses them.
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: Bonus expiry when the entry applies to a bonus tranche; otherwise null.
        sourceType:
          type: string
          enum: [PAYMENT_ORDER, CHAPTER_UNLOCK, OPERATOR, REVERSAL]
          description: Safe source category only; internal source identifiers are not exposed.
        occurredAt:
          type: string
          format: date-time
          description: Ledger commit timestamp used for newest-first pagination.
    ReaderPreferences:
      type: object
      additionalProperties: false
      required: [schemaVersion, theme, fontFamily, fontSize, lineHeight, contentWidth]
      properties:
        schemaVersion:
          type: integer
          const: 1
          default: 1
          description: Preferences payload version; unsupported versions fail validation.
        theme:
          type: string
          enum: [light, sepia, dark]
          default: light
        fontFamily:
          type: string
          enum: [serif, sans]
          default: serif
        fontSize:
          type: integer
          minimum: 16
          maximum: 28
          default: 20
        lineHeight:
          type: number
          minimum: 1.2
          maximum: 2.2
          default: 1.8
        contentWidth:
          type: integer
          minimum: 560
          maximum: 900
          default: 720
