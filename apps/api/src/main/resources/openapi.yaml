          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
        privacyNoticeVersion:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
        termsAccepted:
          type: boolean
          const: true
        privacyNoticeAcknowledged:
          type: boolean
          const: true
    PolicyVersion:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
    PolicyAcceptanceResponse:
      type: object
