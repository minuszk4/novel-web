  /api/v1/me/reading-sessions/{sessionId}:heartbeat:
    post:
      operationId: heartbeatCultivationReadingSession
      tags: [Progression]
      x-implementation-status: implemented-postgres-profile-feature-gated
      summary: Send an ordered reading-session heartbeat
      description: >-
        The server computes active seconds only from database receipt times. At most 60 seconds are recorded for a
        heartbeat; the session expires after 90 seconds without a valid heartbeat. Send every 30 seconds while the
        Reader is visible and focused, and send active=false when it becomes hidden or blurred. Sequence numbers must
        be consecutive. The Idempotency-Key binds one exact body; a replay returns the stored response without adding
        time. Each accepted heartbeat may award XP atomically; the response includes the exact award and an idempotent
        replay returns the same receipt. A new heartbeat after close, idle expiry or access revocation returns 410 Gone.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9._~-]{16,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CultivationReadingSessionHeartbeatRequest'
      responses:
        '200':
          description: Accepted heartbeat and server-derived bounded interval
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CultivationReadingSessionHeartbeat'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
