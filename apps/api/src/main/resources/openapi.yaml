        workTitle:
          type: string
          maxLength: 300
        chapterTitle:
          type: string
          maxLength: 300
        submitterDisplayName:
          type: string
          maxLength: 200
        sourceLanguage:
          type: string
          maxLength: 35
        targetLanguage:
          type: string
          maxLength: 35
        snapshotDigest:
          type: string
          pattern: '^[a-f0-9]{64}$'
        segmentCount:
          type: integer
          minimum: 1
          maximum: 5000
        submittedAt:
          type: string
          format: date-time
        canDecide:
          type: boolean
        segments:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/TranslationReviewSegment'
    TranslationReviewSegment:
      type: object
      additionalProperties: false
      required: [ordinal, editRevision, translatedSha256, sourceText, submittedText]
      properties:
        ordinal:
          type: integer
          minimum: 1
          maximum: 5000
        editRevision:
