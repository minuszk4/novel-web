      summary: Create an owned staging import after rights and policy checks
      description: >-
        The server derives the actor from the active session, requires current Terms and Privacy acceptance, confirms
        the current approved rights version, locks and consumes an actor-bound one-time receipt, checks library write
        access and validates supported filename/MIME hints and the configured size limit in one PostgreSQL transaction.
        HTML/HTM documents have an additional 4 MiB cap and Markdown files have an additional 16 MiB cap before a staging job is created.
        A PostgreSQL user-row lock serializes active-job and declared-byte quota checks; rejected quota requests do not
        consume the rights receipt. Existing matching receipt retries remain idempotent and rotate the upload token.
        Per-actor create requests use a persistent token bucket. Rate-limited responses include Retry-After.
        It creates a private staging job and returns a short-lived same-origin upload target only after commit. The
        target includes a random one-time token; only its SHA-256 is persisted. Retrying the same receipt and metadata
        returns the same pending job with a rotated target token. A changed request cannot reuse the receipt. Browser
        filename, MIME type and declared size remain untrusted; bytes are checked against the declared length when
        uploaded. UTF-8 TXT/HTML/Markdown content is checked against its extension; EPUB must have the required first stored
        mimetype entry and container document. ZIP entry count, path traversal/depth, per-entry and total expanded
        bytes, compression ratio and validation time are bounded before the job is marked uploaded. This is a safe
        envelope check, not full EPUB/package parsing. Local filesystem staging is intended for the single-node
        development profile; production object-storage deployment remains a gate.
