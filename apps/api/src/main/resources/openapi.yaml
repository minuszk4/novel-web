        rowNumber:
          type: integer
          minimum: 1
        importedTerm:
          $ref: '#/components/schemas/GlossaryImportedTerm'
        suggestedAction:
          type: string
          enum: [ADD, UPDATE, UNCHANGED, RESOLVE_CONFLICT]
        existingMatches:
          type: array
          items:
            $ref: '#/components/schemas/GlossaryImportPatternMatch'
          description: At most the first 100 current term matches in glossary order.
        matchesTruncated:
          type: boolean
          description: True when more than 100 existing matches were omitted from this row.
    GlossaryImportPatternMatch:
      type: object
      additionalProperties: false
      required: [termId, reason]
      properties:
        termId:
          type: string
          format: uuid
        reason:
          type: string
          enum: [CANONICAL_TERM_MATCH, PATTERN_COLLISION]
    GlossaryImportCounts:
      type: object
      additionalProperties: false
      required: [imported, add, update, unchanged, requiresResolution]
      properties:
        imported:
          type: integer
          minimum: 0
        add:
          type: integer
          minimum: 0
        update:
          type: integer
          minimum: 0
        unchanged:
          type: integer
          minimum: 0
        requiresResolution:
          type: integer
          minimum: 0
    GlossaryTranslationImpact:
      type: object
      additionalProperties: false
      required: [status, affectedTranslationUnitCount, detail]
      properties:
        status:
          type: string
          const: UNAVAILABLE
        affectedTranslationUnitCount:
          type: [integer, 'null']
          minimum: 0
        detail:
          type: string
    GlossaryImportIssue:
      type: object
      additionalProperties: false
      required: [code, field, rowNumber, message]
      properties:
        code:
          type: string
          maxLength: 64
        field:
          type: [string, 'null']
          maxLength: 64
        rowNumber:
          type: integer
          minimum: 0
        message:
          type: string
          maxLength: 256
    GlossaryImportProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [issueCount, issues, issuesTruncated]
          properties:
            issueCount:
              type: integer
              minimum: 1
            issues:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/GlossaryImportIssue'
            issuesTruncated:
              type: boolean
    GlossaryImportApplyRequest:
      type: object
      additionalProperties: false
      required: [format, fileContentBase64, resolutions]
      properties:
        format:
          type: string
          enum: [JSON, CSV, TSV]
        fileContentBase64:
          type: string
          format: byte
          maxLength: 1398104
          description: Original UTF-8 import file, decoded size at most 1 MiB.
        resolutions:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/GlossaryImportRowResolution'
    GlossaryImportRowResolution:
      type: object
      additionalProperties: false
      required: [rowNumber, action, targetTermId, term]
      properties:
        rowNumber:
          type: integer
          minimum: 1
          description: JSON row index or delimited-file physical line number from import preview.
        action:
          type: string
          enum: [ADD, REPLACE, MERGE, SKIP]
        targetTermId:
          type: [string, 'null']
          format: uuid
          description: Required for REPLACE and MERGE; null for ADD and SKIP.
        term:
          oneOf:
            - $ref: '#/components/schemas/GlossaryImportResolvedTerm'
            - type: 'null'
          description: Complete final fields for ADD, REPLACE or MERGE; null for SKIP.
    GlossaryImportResolvedTerm:
      type: object
      additionalProperties: false
      required: [sourceTerm, targetTerm, priority, casePolicy, matchMode, doNotTranslate, contextNote, aliases]
      properties:
        sourceTerm:
          type: string
          minLength: 1
          maxLength: 512
        targetTerm:
          type: [string, 'null']
          maxLength: 4096
        priority:
          type: integer
          minimum: -1000000
          maximum: 1000000
        casePolicy:
          type: string
          enum: [SENSITIVE, INSENSITIVE]
        matchMode:
          type: string
          const: WHOLE_PHRASE
        doNotTranslate:
          type: boolean
        contextNote:
          type: [string, 'null']
          maxLength: 2000
        aliases:
          type: array
          maxItems: 25
          items:
            type: string
            minLength: 1
            maxLength: 512
    GlossaryImportApplyResult:
      type: object
      additionalProperties: false
      required: [draft, rows, skippedRows, replayed]
      properties:
        draft:
          $ref: '#/components/schemas/GlossaryDraftCreated'
        rows:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/GlossaryImportAppliedRow'
        skippedRows:
          type: integer
          minimum: 0
        replayed:
          type: boolean
    GlossaryImportAppliedRow:
      type: object
      additionalProperties: false
      required: [rowNumber, action, termId]
      properties:
        rowNumber:
          type: integer
          minimum: 1
        action:
          type: string
          enum: [ADD, REPLACE, MERGE, SKIP]
        termId:
          type: [string, 'null']
          format: uuid
          description: Stable draft term ID; null for a skipped row.
    GlossaryImportApplyProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            rowNumber:
              type: integer
              minimum: 1
            issueCount:
              type: integer
              minimum: 1
            issues:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/GlossaryImportIssue'
            issuesTruncated:
              type: boolean
    CreateGlossaryRequest:
      type: object
      additionalProperties: false
      description: Scope target IDs must match the selected scope exactly; the server rejects missing or extra targets.
      required: [name, scope, sourceLanguage, targetLanguage]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        scope:
          type: string
          enum: [USER_GLOBAL, LIBRARY, WORK, VOLUME, CHAPTER]
        sourceLanguage:
          type: string
          minLength: 2
          maxLength: 35
          description: BCP 47 language tag.
        targetLanguage:
          type: string
          minLength: 2
          maxLength: 35
          description: BCP 47 language tag.
        libraryId:
          type: [string, 'null']
          format: uuid
        workId:
          type: [string, 'null']
          format: uuid
        volumeId:
          type: [string, 'null']
          format: uuid
        chapterId:
          type: [string, 'null']
          format: uuid
    GlossaryCatalogPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/GlossaryCatalogItem'
        nextCursor:
          type: [string, 'null']
          maxLength: 512
    GlossaryCatalogItem:
      type: object
      additionalProperties: false
      required: [id, name, scope, sourceLanguage, targetLanguage, version, activeRevisionId, activeRevisionNumber, latestRevisionNumber, createdAt, canWrite]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        scope:
          type: string
          enum: [USER_GLOBAL, LIBRARY, WORK, VOLUME, CHAPTER]
        sourceLanguage:
          type: string
          maxLength: 35
        targetLanguage:
          type: string
          maxLength: 35
        version:
          type: integer
          format: int64
          minimum: 1
        activeRevisionId:
          type: [string, 'null']
          format: uuid
        activeRevisionNumber:
          type: [integer, 'null']
          minimum: 1
          description: Visible active revision number, or null when no revision has been published.
        latestRevisionNumber:
          type: [integer, 'null']
          minimum: 1
          description: Latest draft-base revision number for writers; null for readers or an empty glossary.
        createdAt:
          type: string
          format: date-time
        canWrite:
          type: boolean
          description: Actor may edit this glossary now; mutations still enforce authorization independently.
    GlossaryActiveRevision:
      type: object
      additionalProperties: false
      required:
        [glossaryId, name, scope, sourceLanguage, targetLanguage, version, activeRevisionId, revisionNumber, parentRevisionId, revisionCreatedAt, terms]
      properties:
        glossaryId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 300
        scope:
          type: string
          enum: [USER_GLOBAL, LIBRARY, WORK, VOLUME, CHAPTER]
        sourceLanguage:
          type: string
          maxLength: 64
        targetLanguage:
          type: string
          maxLength: 64
        version:
          type: integer
          format: int64
          minimum: 1
        activeRevisionId:
          type: string
          format: uuid
        revisionNumber:
          type: integer
          minimum: 1
        parentRevisionId:
          type: [string, 'null']
          format: uuid
        revisionCreatedAt:
          type: string
          format: date-time
        terms:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/GlossaryTerm'
    GlossaryWritableRevision:
      type: object
      additionalProperties: false
      required:
        [glossaryId, name, scope, sourceLanguage, targetLanguage, version, activeRevisionId, revisionId, revisionNumber, parentRevisionId, revisionCreatedAt, terms]
      description: The latest revision for a writable actor; it may be newer than activeRevisionId. A null activeRevisionId means no revision has been published.
      properties:
        glossaryId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 300
        scope:
          type: string
          enum: [USER_GLOBAL, LIBRARY, WORK, VOLUME, CHAPTER]
        sourceLanguage:
          type: string
          maxLength: 64
        targetLanguage:
          type: string
          maxLength: 64
        version:
          type: integer
          format: int64
          minimum: 1
        activeRevisionId:
          type: [string, 'null']
          format: uuid
        revisionId:
          type: string
          format: uuid
        revisionNumber:
          type: integer
          minimum: 1
        parentRevisionId:
          type: [string, 'null']
          format: uuid
        revisionCreatedAt:
          type: string
          format: date-time
        terms:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/GlossaryTerm'
    GlossaryTerm:
      type: object
      additionalProperties: false
      required: [id, ordinal, sourceTerm, targetTerm, priority, casePolicy, matchMode, doNotTranslate, contextNote, aliases]
      properties:
        id:
          type: string
          format: uuid
        ordinal:
          type: integer
          minimum: 0
        sourceTerm:
          type: string
          maxLength: 512
        targetTerm:
          type: [string, 'null']
          maxLength: 4096
        priority:
          type: integer
          minimum: -1000000
          maximum: 1000000
        casePolicy:
          type: string
          enum: [SENSITIVE, INSENSITIVE]
        matchMode:
          type: string
          enum: [WHOLE_PHRASE]
        doNotTranslate:
          type: boolean
        contextNote:
          type: [string, 'null']
          maxLength: 2000
        aliases:
          type: array
          maxItems: 25
          items:
            type: string
            maxLength: 512
    GrantPublicationReviewerRequest:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          enum: [REVIEW_CAPACITY, TEMPORARY_COVERAGE, ROLE_CORRECTION]
    RevokePublicationReviewerRequest:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          enum: [ACCESS_ENDED, ROLE_CHANGE, SECURITY_REVIEW]
    ReviewerAssignmentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewerAssignment'
    ReviewerAccountSearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 3
          maxLength: 320
          description: Email prefix or an exact user UUID. Sent in the body, never a URL.
    ReviewerAccountSearchResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ReviewerAccountCandidate'
    ReviewerAccountCandidate:
      type: object
      additionalProperties: false
      required: [userId, displayName, maskedContactEmail, status]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 200
        maskedContactEmail:
          type: [string, 'null']
          maxLength: 320
          description: Masked verified email; null when the active account has no verified email.
        status:
          type: string
          const: active
    ReviewerAssignment:
      type: object
      additionalProperties: false
      required:
        [assignmentId, userId, displayName, contactEmail, maskedContactEmail, userStatus, assignedByUserId, assignedAt, reasonCode, revokedAt, revokedByUserId, revocationReasonCode, lastEventId, lastEventActionCode, lastEventActorUserId, lastEventOccurredAt, lastEventReasonCode]
      properties:
        assignmentId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 200
        contactEmail:
          type: [string, 'null']
          format: email
          maxLength: 320
          deprecated: true
          description: Backward-compatible field containing the same masked value as maskedContactEmail.
        maskedContactEmail:
          type: [string, 'null']
          format: email
          maxLength: 320
          description: Verified contact email masked for display.
        userStatus:
          type: string
          enum: [active, pending, suspended, deleted]
        assignedByUserId:
          type: [string, 'null']
          format: uuid
        assignedAt:
          type: string
          format: date-time
        reasonCode:
          type: string
          enum: [REVIEW_CAPACITY, TEMPORARY_COVERAGE, ROLE_CORRECTION, INITIAL_ADMIN_BOOTSTRAP]
        revokedAt:
          type: [string, 'null']
          format: date-time
        revokedByUserId:
          type: [string, 'null']
          format: uuid
        revocationReasonCode:
          type: [string, 'null']
          enum: [ACCESS_ENDED, ROLE_CHANGE, SECURITY_REVIEW]
        lastEventId:
          type: [string, 'null']
          format: uuid
        lastEventActionCode:
          type: [string, 'null']
          enum: [GRANTED, REVOKED]
        lastEventActorUserId:
          type: [string, 'null']
          format: uuid
        lastEventOccurredAt:
          type: [string, 'null']
          format: date-time
        lastEventReasonCode:
          type: [string, 'null']
          enum: [REVIEW_CAPACITY, TEMPORARY_COVERAGE, ROLE_CORRECTION, ACCESS_ENDED, ROLE_CHANGE, SECURITY_REVIEW]
    RoleAssignmentCommand:
      type: object
      additionalProperties: false
      required: [resultCode, assignment, replayed]
      properties:
        resultCode:
          type: string
          enum: [GRANTED, ALREADY_ACTIVE]
        assignment:
          $ref: '#/components/schemas/ReviewerAssignment'
        replayed:
          type: boolean
    Problem:
      type: object
      required: [type, title, status, detail, code, correlationId]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        correlationId:
          type: string
          minLength: 1
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
  responses:
    Problem:
      description: Safe problem response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
