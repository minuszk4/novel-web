      tags: [Reader]
      x-implementation-status: implemented
      summary: Get the current user's reader preferences
      security:
        - appSession: []
      responses:
        '200':
          description: Validated current preferences or server defaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderPreferences'
        '401':
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateReaderPreferences
      tags: [Reader]
      x-implementation-status: implemented
      summary: Save validated reader preferences
      description: User-scoped and idempotent; preferences contain no chapter content or progress anchor.
      security:
        - appSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReaderPreferences'
      responses:
        '200':
          description: Preferences saved and normalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderPreferences'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/works/{workId}/progress:
    get:
      operationId: getWorkReadingProgress
      tags: [Reader]
      x-implementation-status: implemented
      summary: Get this user's progress in an owned work
      security:
        - appSession: []
      parameters:
        - name: workId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Progress snapshot; empty works return a default version-zero snapshot.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingProgress'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      operationId: saveWorkReadingProgress
      tags: [Reader]
      x-implementation-status: implemented
      summary: Save a stable chapter/segment anchor for this user's work
      description: >-
        Actor-scoped to an accessible work, versioned and idempotent for a given position. Repeating the
        same position is safe even if the request is retried with its previous expectedVersion. A
        different position with a stale expectedVersion returns 409 and latestProgress; clients must
        reconcile before the next write. The server validates that the chapter is readable in the work
        and that an anchor occurs in a retained readable revision of that chapter. If the anchor no
        longer exists in the current revision, clients restore by anchor when possible and otherwise
        use scrollRatio. The server owns updatedAt.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: workId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveReadingProgressRequest'
      responses:
        '200':
          description: Updated authoritative progress snapshot
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingProgress'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Progress version is stale; the response includes the latest safe snapshot for reconciliation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProgressConflictProblem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/works/{workId}/bookmarks:
    get:
      operationId: listWorkBookmarks
      tags: [Reader]
      x-implementation-status: implemented
      summary: List private bookmarks in an accessible work
      description: Returns the current user's bookmarks ordered newest-first. Each page rechecks current work access, uses a signed actor/work-bound keyset cursor, and is not cacheable.
      security:
        - appSession: []
      parameters:
        - name: workId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Private bookmarks owned by the current user; no other user's bookmarks are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkListResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createWorkBookmark
      tags: [Reader]
      x-implementation-status: implemented
      summary: Create a private bookmark at a stable chapter anchor
      description: >-
        Validates that the chapter is currently readable and that a non-null stable anchor exists in a retained
        chapter revision. A matching Idempotency-Key retry returns its original response for 24 hours. A distinct
        key for an already-bookmarked position returns the existing bookmark. Reusing a key for different request
        content returns 409; access is rechecked before a cached response is returned.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: workId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookmarkRequest'
      responses:
        '201':
          description: Private bookmark created, or the original/equivalent bookmark returned for an idempotent retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/bookmarks/{bookmarkId}:
    delete:
      operationId: deleteOwnedBookmark
      tags: [Reader]
      x-implementation-status: implemented
      summary: Delete one of the current user's bookmarks
      description: >-
        Owner-scoped and protected by session-bound CSRF. A bookmark belonging to another user is indistinguishable
        from a missing bookmark. Successful responses are no-store.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: bookmarkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Bookmark deleted.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/me/reading-history:
    get:
      operationId: listCurrentUserReadingHistory
      tags: [Reader]
      x-implementation-status: implemented-postgres-profile
      summary: List the current user's recent readable work positions
      description: >-
        Returns one latest saved position per accessible work, newest first by progress.updatedAt and work ID.
        Results older than 365 days, inaccessible works, deleted works, and unavailable or deleted chapters are omitted.
        The signed keyset cursor is bound to the current actor. Chapter title/ordinal metadata is included; chapter body,
        segment text and owner identifiers are never returned. Each response is no-store.
      security:
        - appSession: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Cursor-paginated private reading history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingHistoryResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: clearCurrentUserReadingHistory
      tags: [Reader]
      x-implementation-status: implemented-postgres-profile
      summary: Clear all current-user reading history and saved positions
      description: >-
        Session-bound CSRF is required; deletion remains available when current policy acceptance is pending. Deletes only the current user's reader progress rows, including rows outside
        the visible 365-day window. It is idempotent and returns no-store 204. The works remain in their libraries;
        a subsequent read can create a new history item and saved position.
      security:
        - appSession: []
          csrfToken: []
      responses:
        '204':
          description: All current-user reading history and resume positions were cleared.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/me/reading-history/{workId}:
    delete:
      operationId: deleteCurrentUserReadingHistoryWork
      tags: [Reader]
      x-implementation-status: implemented-postgres-profile
      summary: Clear one work's current-user history and saved position
      description: >-
        Session-bound CSRF is required; deletion remains available when current policy acceptance is pending. Deletes only the current user's reader progress row for this work, even if
        access to the work has since been revoked. Missing rows are treated as success to avoid revealing history state.
        The operation is idempotent and returns no-store 204. The work remains in its library.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: workId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The current-user history item and saved position were cleared, if present.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    appSession:
      type: apiKey
      in: cookie
      name: __Host-novel_session
      description: Opaque, rotated, host-only session cookie with Secure, HttpOnly, SameSite=Lax and Path=/ attributes.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Short-lived synchronizer token returned by GET /api/v1/auth/csrf; held by the browser in memory.
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
        groups:
          type: array
          description: Health groups included by Spring Boot Actuator; component details are hidden.
          items:
            type: string
    ApiSystemStatus:
      type: object
      required: [apiVersion, environment, integrations, features]
      properties:
        apiVersion:
          type: string
          const: v1
        environment:
          type: string
          example: local
        integrations:
          type: object
          required: [googleOidcEnabled, momoTestEnabled, momoEnvironment]
          properties:
            googleOidcEnabled:
              type: boolean
              description: >-
                True when a plausible Google web client ID, secure credential callback URI, and
                32-byte rate-limit HMAC key are configured. This reports local configuration
                readiness; it does not verify reachability or credentials with Google.
            momoTestEnabled:
              type: boolean
              const: false
            momoEnvironment:
              type: string
              const: TEST
        features:
          type: object
          required: [importProcessingEnabled, cultivationEnabled, commerceSandboxEnabled]
          properties:
            importProcessingEnabled:
              type: boolean
              const: false
            cultivationEnabled:
              type: boolean
              const: false
            commerceSandboxEnabled:
              type: boolean
              const: false
    GoogleSignInBootstrap:
      type: object
      additionalProperties: false
      required: [clientId, loginUri, nonce, locale, attemptExpiresAt]
      properties:
        clientId:
          type: string
          description: Public Google Identity Services web client ID for this environment.
        loginUri:
          type: string
          format: uri
          description: Fixed backend callback URI; never supplied by the browser.
        nonce:
          type: string
          minLength: 16
          description: One-use nonce bound to the server-side sign-in attempt.
        locale:
          type: string
          example: vi
        attemptExpiresAt:
          type: string
          format: date-time
    GoogleCredentialForm:
      type: object
      additionalProperties: true
      required: [credential, g_csrf_token]
      properties:
        credential:
          type: string
          minLength: 1
          maxLength: 16384
          description: Google ID-token credential posted directly by GIS; discard after validation.
        g_csrf_token:
          type: string
          minLength: 1
          maxLength: 512
          description: Must exactly match the g_csrf_token cookie.
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token, expiresAt]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: HMAC-derived token bound to the current opaque app session; keep in memory only.
        expiresAt:
          type: string
          format: date-time
          description: Absolute session-expiry upper bound; idle session expiry can occur earlier.
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [user, identityProviders, policy, roles, features]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        identityProviders:
          type: array
          items:
            type: string
            enum: [google]
        policy:
          $ref: '#/components/schemas/UserPolicyState'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleScope'
        features:
          $ref: '#/components/schemas/UserFeatureFlags'
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, displayName, status]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        contactEmail:
          type: [string, 'null']
          format: email
        avatarUrl:
          type: [string, 'null']
          format: uri
        status:
          type: string
          enum: [active, pending, suspended]
    UserPolicyState:
      type: object
      additionalProperties: false
      required: [termsAcceptedVersion, privacyNoticeAcknowledgedVersion, requiredAcceptanceComplete]
      properties:
        termsAcceptedVersion:
          type: [string, 'null']
        privacyNoticeAcknowledgedVersion:
          type: [string, 'null']
        requiredAcceptanceComplete:
          type: boolean
    RoleScope:
      type: object
      additionalProperties: false
      required: [scope, permissions]
      properties:
        scope:
          type: string
          maxLength: 128
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            maxLength: 128
    UserFeatureFlags:
      type: object
      additionalProperties: false
      required: [privateLibraryEnabled, importEnabled, readerEnabled, cultivationEnabled, commerceSandboxEnabled]
      properties:
        privateLibraryEnabled:
          type: boolean
        importEnabled:
          type: boolean
        readerEnabled:
          type: boolean
        cultivationEnabled:
          type: boolean
        commerceSandboxEnabled:
          type: boolean
    CurrentPoliciesResponse:
      type: object
      additionalProperties: false
      required: [terms, privacyNotice]
      properties:
        terms:
          $ref: '#/components/schemas/PolicyDocument'
        privacyNotice:
          $ref: '#/components/schemas/PolicyDocument'
    PolicyDocument:
      type: object
      additionalProperties: false
      required: [version, effectiveAt, documentUrl]
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
        effectiveAt:
          type: string
          format: date-time
        documentUrl:
          type: string
          format: uri-reference
          description: Same-origin URL only.
    PolicyAcceptanceRequest:
      type: object
      additionalProperties: false
      required: [termsVersion, privacyNoticeVersion, termsAccepted, privacyNoticeAcknowledged]
      properties:
        termsVersion:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
        privacyNoticeVersion:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
        termsAccepted:
          type: boolean
          const: true
        privacyNoticeAcknowledged:
          type: boolean
          const: true
    PolicyVersion:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
    PolicyAcceptanceResponse:
      type: object
      additionalProperties: false
      required: [termsAcceptedVersion, termsAcceptedAt, privacyNoticeAcknowledgedVersion, privacyNoticeAcknowledgedAt]
      properties:
        termsAcceptedVersion:
          type: string
        termsAcceptedAt:
          type: string
          format: date-time
        privacyNoticeAcknowledgedVersion:
          type: string
        privacyNoticeAcknowledgedAt:
          type: string
          format: date-time
    SessionListResponse:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionSummary'
    SessionSummary:
      type: object
      additionalProperties: false
      required: [id, deviceSummary, createdAt, lastSeenAt, expiresAt, current]
      properties:
        id:
          type: string
          maxLength: 128
          description: Opaque identifier for revocation; not the session secret.
        deviceSummary:
          type: string
          maxLength: 160
          description: Coarse browser/device label; no raw IP address.
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
    LogoutAllRequest:
      type: object
      additionalProperties: false
      required: [confirmationToken]
      properties:
        confirmationToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Five-minute one-use server-issued token bound to the current user and session.
    LogoutAllConfirmationResponse:
      type: object
      additionalProperties: false
      required: [confirmationToken, expiresAt]
      properties:
        confirmationToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: 256-bit token; keep in memory only and send only to the logout-all endpoint.
        expiresAt:
          type: string
          format: date-time
    LibrarySummary:
      type: object
      additionalProperties: false
      required: [id, name, visibility, isDefault, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        visibility:
          type: string
          const: private
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
    LibraryListResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LibrarySummary'
        nextCursor:
          type: [string, 'null']
          maxLength: 2048
          description: Opaque HMAC-signed cursor bound to the current user and stable sort; null when no next page exists.
    WorkSummary:
      type: object
      additionalProperties: false
      required: [id, libraryId, title, author, language, visibility, chapterCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        libraryId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 300
        author:
          type: string
          maxLength: 200
        language:
          type: string
          maxLength: 35
        visibility:
          type: string
          const: private
        chapterCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        lastReadAt:
          type: [string, 'null']
          format: date-time
    WorkListResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/WorkSummary'
        nextCursor:
          type: [string, 'null']
          maxLength: 2048
          description: Opaque HMAC-signed cursor bound to owner, library, q, tag, status and stable sort; null when no next page exists.
    LibraryCollectionSummary:
      type: object
      additionalProperties: false
      required: [id, name, workCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 40
        workCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LibraryCollectionListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/LibraryCollectionSummary'
    CreateLibraryCollectionRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^.*\S.*$'
    LibraryWorkState:
      type: object
      additionalProperties: false
      required: [workId, readingStatus, collectionIds, version, updatedAt]
      properties:
        workId:
          type: string
          format: uuid
        readingStatus:
          type: string
          enum: [reading, want-to-read, paused, completed, dropped]
        collectionIds:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            type: string
            format: uuid
        version:
          type: integer
          minimum: 0
        updatedAt:
          type: [string, 'null']
          format: date-time
          description: Null until the first state update is saved.
    ReplaceLibraryWorkStateRequest:
      type: object
      additionalProperties: false
      required: [readingStatus, collectionIds]
      properties:
        readingStatus:
          type: string
          enum: [reading, want-to-read, paused, completed, dropped]
        collectionIds:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            type: string
            format: uuid
    LibraryStateVersionConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [latest]
          properties:
            latest:
              $ref: '#/components/schemas/LibraryWorkState'
    ReaderManifest:
      type: object
      additionalProperties: false
      required: [work, sourceLanguage, chapters, nextCursor]
      properties:
        work:
          $ref: '#/components/schemas/WorkSummary'
        sourceLanguage:
          type: string
          maxLength: 35
        chapters:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReaderChapterSummary'
        nextCursor:
          type: [string, 'null']
          maxLength: 2048
          description: Opaque cursor bound to work and chapter order.
    ReaderChapterSummary:
      type: object
      additionalProperties: false
      required: [id, ordinal, title, accessState]
      properties:
        id:
          type: string
          format: uuid
        ordinal:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 300
        accessState:
          type: string
          enum: [readable, preview, locked, owned, unavailable]
    ChapterContent:
      type: object
      additionalProperties: false
      required: [chapterId, workId, sourceRevisionId, sourceLanguage, segments, nextSegmentCursor]
      properties:
        chapterId:
          type: string
          format: uuid
        workId:
          type: string
          format: uuid
        sourceRevisionId:
          type: string
          format: uuid
        sourceLanguage:
          type: string
          maxLength: 35
        segments:
          type: array
          maxItems: 1000
          description: Sanitized semantic source text; raw HTML and executable markup are never returned.
          items:
            $ref: '#/components/schemas/SourceSegment'
        nextSegmentCursor:
          type: [string, 'null']
          maxLength: 2048
          description: Opaque cursor for the next source segment batch.
    SourceSegment:
      type: object
      additionalProperties: false
      required: [anchor, type, sourceText]
      properties:
        anchor:
          type: string
          minLength: 1
          maxLength: 160
        type:
          type: string
          enum: [heading, paragraph, quote]
        sourceText:
          type: string
          maxLength: 20000
    ImportRightsStatement:
      type: object
      additionalProperties: false
      required: [version, effectiveAt, displayText]
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 64
        effectiveAt:
          type: string
          format: date-time
        displayText:
          type: string
          minLength: 1
          maxLength: 8000
          description: Exact approved statement shown before any file bytes are uploaded or processed.
    ImportRightsAcceptanceRequest:
      type: object
      additionalProperties: false
      required: [statementVersion, confirmed]
      properties:
        statementVersion:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
          maxLength: 64
        confirmed:
          type: boolean
          const: true
    ImportRightsAcceptance:
      type: object
      additionalProperties: false
      required: [id, statementVersion, acceptedAt, statementSha256]
      properties:
        id:
          type: string
          format: uuid
        statementVersion:
          type: string
          maxLength: 64
        acceptedAt:
          type: string
          format: date-time
        statementSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 of the exact UTF-8 display text acknowledged by the caller.
    CreateImportRequest:
      type: object
      additionalProperties: false
      required: [libraryId, source, rightsAcceptanceId, rightsStatementVersion, rightsConfirmed]
      properties:
        libraryId:
          type: string
          format: uuid
        rightsAcceptanceId:
          type: string
          format: uuid
          description: One-time actor-bound receipt from POST /imports/rights-statement/acceptance; consumed atomically when the import job is created.
        source:
          $ref: '#/components/schemas/ImportSourceDescriptor'
        rightsStatementVersion:
          type: string
          minLength: 1
          maxLength: 64
        rightsConfirmed:
          type: boolean
          const: true
    ImportSourceDescriptor:
      type: object
      additionalProperties: false
      required: [kind, filename, contentType, sizeBytes]
      properties:
        kind:
          type: string
          const: upload
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: Display metadata only; not trusted as a path or file type.
        contentType:
          type: [string, 'null']
          maxLength: 160
          description: Browser-declared MIME hint; Markdown accepts text/markdown, text/x-markdown, text/plain or application/octet-stream, and all hints are checked against the file extension and bytes.
        sizeBytes:
          type: integer
          minimum: 1
          description: Declared size hint; the server enforces the configured cap and exact streamed byte count.
    ImportUploadTarget:
      type: object
      additionalProperties: false
      required: [method, url, headers, expiresAt]
      properties:
        method:
          type: string
          const: PUT
        url:
          type: string
          format: uri-reference
          description: Short-lived same-origin API path for the private upload target; do not log or persist the one-time token in headers.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Exact headers required by the API upload target, including the one-time token.
        expiresAt:
          type: string
          format: date-time
    ImportCreatedResponse:
      type: object
      additionalProperties: false
      required: [job, uploadTarget]
      properties:
        job:
          $ref: '#/components/schemas/ImportJob'
        uploadTarget:
          $ref: '#/components/schemas/ImportUploadTarget'
    ImportJob:
      type: object
      additionalProperties: false
      required: [id, status, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [upload_pending, uploaded, queued, scanning, parsing, ready_to_commit, committed, failed, cancelled, expired]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        warnings:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ImportWarning'
        failureCode:
          type: [string, 'null']
          maxLength: 96
        previewSummary:
          $ref: '#/components/schemas/ImportPreviewSummary'
    ImportWarning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          maxLength: 96
        message:
          type: string
          maxLength: 500
          description: Safe actionable text; never includes chapter body or raw parser internals.
    ImportPreviewSummary:
      type: object
      additionalProperties: false
      required: [title, author, chapterCount]
      properties:
        title:
          type: string
          maxLength: 300
        author:
          type: [string, 'null']
          maxLength: 200
        chapterCount:
          type: integer
          minimum: 0
    ImportPreview:
      type: object
      additionalProperties: false
      required: [importId, version, title, author, chapterCount, language, chapters, nextCursor, warnings]
      properties:
        importId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 300
        author:
          type: string
          maxLength: 200
        chapterCount:
          type: integer
          minimum: 0
        language:
          type: string
          maxLength: 35
        chapters:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ImportChapterPreview'
        nextCursor:
          type: [string, 'null']
          maxLength: 2048
        warnings:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ImportWarning'
    ImportChapterPreview:
      type: object
      additionalProperties: false
      required: [id, ordinal, title]
      properties:
        id:
          type: string
          format: uuid
        ordinal:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 300
    ImportPreviewPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        author:
          type: string
          maxLength: 200
        language:
          type: string
          maxLength: 35
        chapterOrder:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
    ReaderPreferences:
      type: object
      additionalProperties: false
      required: [schemaVersion, theme, fontFamily, fontSize, lineHeight, contentWidth]
      properties:
        schemaVersion:
          type: integer
          const: 1
          default: 1
          description: Preferences payload version; unsupported versions fail validation.
        theme:
          type: string
          enum: [light, sepia, dark]
          default: light
        fontFamily:
          type: string
          enum: [serif, sans]
          default: serif
        fontSize:
          type: integer
          minimum: 16
          maximum: 28
          default: 20
        lineHeight:
          type: number
          minimum: 1.2
          maximum: 2.2
          default: 1.8
        contentWidth:
          type: integer
          minimum: 560
          maximum: 900
          default: 720
    ReadingProgress:
      type: object
      additionalProperties: false
      required: [workId, chapterId, segmentAnchor, scrollRatio, version, updatedAt]
      properties:
        workId:
          type: string
          format: uuid
        chapterId:
          type: [string, 'null']
          format: uuid
        segmentAnchor:
          type: [string, 'null']
          maxLength: 160
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$'
        scrollRatio:
          type: number
          minimum: 0
          maximum: 1
        version:
          type: integer
          minimum: 0
        updatedAt:
          type: [string, 'null']
          format: date-time
    ProgressConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [latestProgress]
          properties:
            latestProgress:
              $ref: '#/components/schemas/ReadingProgress'
    SaveReadingProgressRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, chapterId, segmentAnchor, scrollRatio]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        chapterId:
          type: [string, 'null']
          format: uuid
          description: Null denotes an empty position and requires null segmentAnchor and scrollRatio zero.
        segmentAnchor:
          type: [string, 'null']
          maxLength: 160
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$'
        scrollRatio:
          type: number
          minimum: 0
          maximum: 1
    BookmarkListResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Bookmark'
        nextCursor:
          type: [string, 'null']
          maxLength: 2048
    Bookmark:
      type: object
      additionalProperties: false
      required: [id, workId, chapterId, segmentAnchor, label, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workId:
          type: string
          format: uuid
        chapterId:
          type: string
          format: uuid
        segmentAnchor:
          type: [string, 'null']
          maxLength: 160
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$'
        label:
          type: string
          minLength: 1
          maxLength: 160
        createdAt:
          type: string
          format: date-time
    CreateBookmarkRequest:
      type: object
      additionalProperties: false
      required: [chapterId, segmentAnchor, label]
      properties:
        chapterId:
          type: string
          format: uuid
        segmentAnchor:
          type: [string, 'null']
          maxLength: 160
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$'
        label:
          type: string
          minLength: 1
          maxLength: 160
    ReadingHistoryResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReadingHistoryItem'
        nextCursor:
          type: [string, 'null']
          maxLength: 2048
    ReadingHistoryItem:
      type: object
      additionalProperties: false
      required: [work, progress]
      properties:
        work:
          $ref: '#/components/schemas/WorkSummary'
        chapter:
          $ref: '#/components/schemas/ReadingHistoryChapter'
        progress:
          $ref: '#/components/schemas/ReadingProgress'
    ReadingHistoryChapter:
      type: object
      additionalProperties: false
      required: [id, ordinal, title]
      description: Readable chapter metadata only; chapter body and source segments are excluded.
      properties:
        id:
          type: string
          format: uuid
        ordinal:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 300
    Problem:
      type: object
      required: [type, title, status, detail, code, correlationId]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        correlationId:
          type: string
          minLength: 1
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
  responses:
    Problem:
      description: Safe problem response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
