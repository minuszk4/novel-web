openapi: 3.1.0
info:
  title: Novel Web API
  version: 6.1.0
  description: >-
    Contract for the Novel Web API. System status and health are implemented in the local foundation.
    Google sign-in/session, policy-document/acceptance, library/work list and personal library-state routes are
    implemented only in the configured PostgreSQL profile. The import-rights statement read and acceptance routes
    are also implemented in that profile; private job creation and local staging upload are now implemented too.
    Import staging applies actor-scoped active-job/declared-byte quotas and persistent create/upload token buckets;
    HTML documents have a 4 MiB source limit and Markdown has a 16 MiB source limit, both lower than the configured general upload limit.
    EPUB 3, bounded UTF-8 TXT and single-document HTML/Markdown parse queue/status, private-preview persistence/edit and atomic private import
    commit are implemented. Markdown uses CommonMark core only, strips raw HTML and link destinations, and derives chapter boundaries from repeated top-level headings.
    Source-only Reader manifest, chapter-content, progress, reader-preferences, bookmarks and private reading-history routes are implemented in the PostgreSQL profile.
    History is derived from the latest saved progress per accessible readable work, is visible for 365 days, and never returns chapter body text.
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: System
    description: Implemented read-only status and health operations.
  - name: Auth
    description: Google GIS, session and required policy routes are available only in the PostgreSQL profile; other Auth operations remain planned.
    x-implementation-status: partial
  - name: Library
    description: Library/work listing, personal reading-state/collection, import-rights and local upload-staging operations are available in the PostgreSQL profile; parsing and other operations remain planned for G2.
    x-implementation-status: partial
  - name: Reader
    description: Source-only reader, progress, preferences, private bookmarks and private reading history are available in the PostgreSQL profile.
    x-implementation-status: partial
paths:
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      tags: [System]
      summary: Get API and integration availability
      description: Returns feature availability only; no account data or provider secrets are exposed.
      security: []
      responses:
        '200':
          description: Current API slice status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSystemStatus'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /actuator/health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Get API health
      description: Returns the aggregate health status exposed by Spring Boot Actuator; details are not exposed.
      security: []
      responses:
        '200':
          description: API and configured dependencies are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          description: API or a required dependency is not healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/auth/google/bootstrap:
    get:
      operationId: getGoogleSignInBootstrap
      tags: [Auth]
      x-implementation-status: implemented-postgres-profile
      summary: Create a short-lived Google sign-in attempt
      description: >-
        Rate-limited. Stores a one-use nonce attempt and returns only the public GIS client ID,
        fixed credential callback URI, locale and nonce. `returnTo` must be a safe relative path;
        the server stores it with the attempt and never accepts an arbitrary callback host.
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Safe relative application path; invalid or external values fall back to /app/home.
          schema:
            type: string
            maxLength: 512
          example: /app/home
        - name: locale
          in: query
          required: false
          schema:
            type: string
            default: vi
            example: vi
      responses:
        '200':
          description: Short-lived, one-use sign-in bootstrap
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleSignInBootstrap'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/google/credential:
    post:
      operationId: submitGoogleCredential
      tags: [Auth]
      x-implementation-status: implemented-postgres-profile
      summary: Validate GIS credential and establish an application session
      description: >-
        Fixed GIS redirect callback. This is the only unauthenticated mutation exempt from the
        application CSRF header: it requires the GIS double-submit `g_csrf_token` cookie and matching
        form field, a live one-use nonce attempt, valid Google claims/signature and an exact Origin in
        the configured CORS allowlist. It accepts only UTF-8 form-urlencoded bodies up to 24 KiB.
        Google posts the credential directly to the API; Angular must not receive or store it. Success
        creates or rotates an opaque app session and redirects only to the path stored at bootstrap.
      security: []
      parameters:
        - name: Origin
          in: header
          required: true
          description: Browser origin; must exactly match a configured frontend CORS origin.
          schema:
            type: string
            format: uri
        - name: g_csrf_token
          in: cookie
          required: true
          description: GIS double-submit token; must match the form field byte-for-byte.
          schema:
            type: string
            minLength: 1
            maxLength: 512
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleCredentialForm'
      responses:
        '303':
          description: Credential accepted; browser is redirected to the server-stored safe return path.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
            Location:
              required: true
              description: Same-origin relative application path only.
              schema:
                type: string
                pattern: '^/(?!/)(?!.*\\)'
            Set-Cookie:
              required: true
              description: >-
                Issued or rotated opaque session cookie with Secure, HttpOnly, SameSite=Lax, Path=/ and no Domain.
                The cookie value is never returned in JSON or logged.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [Auth]
      x-implementation-status: implemented-postgres-profile
      summary: Get the CSRF token bound to the current session
      description: >-
        Returns a session-bound HMAC token. The API derives it from the opaque session cookie and a
        separate server HMAC key; it does not persist or expose the session cookie. The client keeps the
        token in memory and sends it as X-CSRF-Token on cookie-authenticated mutations. It changes when
        the app session rotates. expiresAt is the absolute session-expiry upper bound; idle expiry can
        occur earlier. This response must not be cached.
      security:
        - appSession: []
      responses:
        '200':
          description: CSRF token for the current session
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      x-implementation-status: implemented-postgres-profile
      summary: Get the current application user and access state
      description: >-
        Returns only the authenticated principal's first-party profile, linked provider names, latest recorded
        policy versions, base personal scope and server feature flags. requiredAcceptanceComplete is true only
        when both active policy records match the latest recorded decisions; it stays false until both approved
        policy documents are available and accepted. Product permissions and features remain disabled until their
        backend routes are implemented. The response is no-store and never returns Google subject, credential,
        session secret or raw provider claims.
      security:
        - appSession: []
      responses:
        '200':
          description: Current application user
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/policies/current:
    get:
      operationId: getCurrentPolicies
      tags: [Auth]
      x-implementation-status: implemented-postgres-profile
      summary: Get active Terms and Privacy Notice versions
      description: >-
        Public metadata for the latest effective Terms and Privacy Notice versions. Each documentUrl is a
        same-origin versioned Markdown route. Returns POLICY_NOT_CONFIGURED until both legally approved documents
        have been provisioned. Policy versions and documents are immutable; publish corrections as new versions.
      security: []
      responses:
        '200':
          description: Active policy documents and effective dates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentPoliciesResponse'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/policies/terms/{version}:
    get:
      operationId: getTermsDocument
      tags: [Auth]
      x-implementation-status: implemented-postgres-profile
      summary: Get an immutable Terms version
      security: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PolicyVersion'
      responses:
        '200':
          description: Versioned Markdown document
          content:
            text/markdown:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/policies/privacy-notice/{version}:
    get:
      operationId: getPrivacyNoticeDocument
      tags: [Auth]
      x-implementation-status: implemented-postgres-profile
      summary: Get an immutable Privacy Notice version
      security: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PolicyVersion'
      responses:
        '200':
          description: Versioned Markdown document
          content:
            text/markdown:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/policies/accept:
    post:
      operationId: acceptCurrentPolicies
      tags: [Auth]
      x-implementation-status: implemented-postgres-profile
      summary: Record explicit acceptance of current required policies
      description: >-
        Both decisions and exact current versions are required. The server records separate append-only
        policy events with server timestamps; it creates neither event if either choice is missing or stale.
        Repeating the same accepted version pair is idempotent.
      security:
        - appSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyAcceptanceRequest'
      responses:
        '200':
          description: Both current policy decisions are recorded
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyAcceptanceResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          description: One or both submitted versions are no longer current; no partial acceptance is recorded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/logout:
    post:
      operationId: logoutCurrentSession
      tags: [Auth]
      x-implementation-status: implemented-postgres-profile
      summary: Revoke the current application session
      description: >-
        Revokes the current application session and always clears the host-only cookie. Repeated requests are
        idempotent. If a canonical session cookie is present, a matching X-CSRF-Token is required. A request
        with no usable session cookie may only clear the cookie without CSRF because it has no authenticated
        session to mutate. This does not sign the user out of Google.
      security:
        - appSession: []
          csrfToken: []
      responses:
        '204':
          description: Session revoked or already absent; cookie cleared.
          headers:
            Set-Cookie:
              description: Expired session cookie with the same Path and host-only scope.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/sessions:
    get:
      operationId: listCurrentUserSessions
      tags: [Auth]
      x-implementation-status: planned
      summary: List the current user's active sessions
      description: Returns coarse device and time metadata only; no raw IP address, session secret or token.
      security:
        - appSession: []
      responses:
        '200':
          description: Active sessions belonging to the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/sessions/{sessionId}:
    delete:
      operationId: revokeUserSession
      tags: [Auth]
      x-implementation-status: planned
      summary: Revoke another active session
      description: A caller cannot revoke the current session through this route; use the logout operation instead.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The requested session is the current session and requires the logout flow.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/logout-all/confirmation:
    post:
      operationId: issueLogoutAllConfirmation
      tags: [Auth]
      x-implementation-status: implemented-postgres-profile
      summary: Issue a short-lived one-use logout-all confirmation
      description: >-
        Call only after the user explicitly confirms the all-session sign-out warning. The 256-bit token is
        bound to the current active user and session, expires after five minutes, is returned once with no-store
        headers, and is stored only as a hash. Issuing another token for the same session invalidates its prior
        unconsumed token.
      security:
        - appSession: []
          csrfToken: []
      responses:
        '200':
          description: One-use confirmation token
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutAllConfirmationResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAllSessions
      tags: [Auth]
      x-implementation-status: implemented-postgres-profile
      summary: Revoke all sessions for the current user
      description: >-
        Atomically consumes a five-minute confirmation issued for this exact user/session and revokes all
        current application sessions, including the caller's. A confirmation is one-use, stored only as a hash,
        and cannot be used by another account or session. Invalid, expired, replayed or differently-bound tokens
        revoke no sessions. Clears the caller cookie after success and never signs out of Google.
      security:
        - appSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutAllRequest'
      responses:
        '204':
          description: All current-user application sessions are revoked and the current cookie is cleared.
          headers:
            Set-Cookie:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/libraries:
    get:
      operationId: listCurrentUserLibraries
      tags: [Library]
      x-implementation-status: implemented-postgres-profile
      summary: List libraries accessible to the current user
      description: >-
        Returns the user's personal libraries and active workspace libraries the user can access. Never accepts an
        owner or user ID from the browser. Cursors are HMAC-signed and bound to the authenticated principal and
        current workspace access scope; pages use the stable order isDefault descending, createdAt descending, then
        id descending. Responses omit owner and workspace membership identifiers.
        All responses use Cache-Control no-store and Pragma no-cache.
      security:
        - appSession: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Personal and active-workspace libraries accessible to the current user
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryListResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          description: Current required policy acceptance is incomplete; private library metadata is not returned.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          description: Cursor is malformed, tampered or bound to a different actor/access scope/sort.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Policy, database, or cursor signing configuration is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/works:
    get:
      operationId: listPrivateWorks
      tags: [Library]
      x-implementation-status: implemented-postgres-profile
      summary: List works in an accessible library
      description: >-
        Cursor is HMAC-signed and bound to the authenticated principal, current library access scope, stable sort order
        and all active filters. Pages sort by createdAt descending then id descending. User identity is derived from
        the session. Responses omit owner IDs and source content hashes and use Cache-Control no-store and
        Pragma no-cache.
      security:
        - appSession: []
      parameters:
        - name: libraryId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Case-insensitive substring search in title and author; source chapter text is not searched.
          schema:
            type: string
            maxLength: 160
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: tag
          in: query
          description: Optional exact match on the owner's normalized tag slug.
          schema:
            type: string
            maxLength: 80
        - name: status
          in: query
          description: Optional work lifecycle filter.
          schema:
            type: string
            enum: [active, archived]
      responses:
        '200':
          description: Private works visible to the current user in the selected library
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkListResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '400':
          description: Cursor is malformed, tampered or bound to a different actor/library/filter/access scope/sort.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Policy, database, or cursor signing configuration is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/me/library/collections:
    get:
      operationId: listMyLibraryCollections
      tags: [Library]
      x-implementation-status: implemented-postgres-profile
      summary: List the current user's personal library collections
      description: Returns only collections owned by the authenticated user, with counts limited to currently accessible works.
      security:
        - appSession: []
      responses:
        '200':
          description: Personal collections, at most 12
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryCollectionListResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createMyLibraryCollection
      tags: [Library]
      x-implementation-status: implemented-postgres-profile
      summary: Create a personal library collection
      description: Collection names are unique case-insensitively for each user. The transaction enforces a maximum of 12 active collections.
      security:
        - appSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLibraryCollectionRequest'
      responses:
        '201':
          description: Collection created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryCollectionSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          description: Duplicate name or the user already has 12 active collections.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/me/library/collections/{collectionId}:
    delete:
      operationId: deleteMyLibraryCollection
      tags: [Library]
      x-implementation-status: implemented-postgres-profile
      summary: Delete a personal library collection
      description: Soft-deletes the actor's collection, removes its work memberships and advances affected reading-state versions.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: collectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Collection deleted
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/me/works/{workId}/library-state:
    get:
      operationId: getMyWorkLibraryState
      tags: [Library]
      x-implementation-status: implemented-postgres-profile
      summary: Get the current user's reading status and personal collections for a work
      description: >-
        The reading status is per actor and independent of the work publishing/lifecycle status. The actor must
        currently be able to read the personal or workspace work. A missing saved state is returned as
        want-to-read with version 0 and is not written until the first update.
      security:
        - appSession: []
      parameters:
        - name: workId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current actor-scoped reading state
          headers:
            ETag:
              required: true
              schema:
                type: string
                pattern: '^"v(0|[1-9][0-9]*)"$'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryWorkState'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    put:
      operationId: replaceMyWorkLibraryState
      tags: [Library]
      x-implementation-status: implemented-postgres-profile
      summary: Replace the current user's reading status and collection membership for a work
      description: >-
        This atomic, actor-scoped replacement advances the ETag version when state changes. The work must currently
        be readable by the actor and every collection ID must belong to that actor. A retried request with stale
        If-Match but a body identical to the current state returns the current representation; divergent stale
