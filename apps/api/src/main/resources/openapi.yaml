  /api/v1/imports/{importId}/commit:
    post:
      operationId: commitPrivateImport
      tags: [Library]
      x-implementation-status: implemented
      summary: Atomically commit a ready import as a private work
      description: >-
        Requires an owned, successfully parsed job, the unchanged strong preview ETag and an Idempotency-Key.
        The commit path accepts normalized source content from parser schemas epub3-v2, txt-v1, html-v1 and markdown-v1; older or
        unsupported parser results must be imported again. TXT revisions use source_format plain_text and stable
        txt-* segment anchors; HTML revisions use xhtml and html-* anchors; Markdown revisions use markdown and md-* anchors;
        EPUB revisions use epub_xhtml and epub-* anchors.
        In one PostgreSQL transaction, rechecks current policy, rights receipt/version and library write access;
        copies normalized source segments into private work/chapter/revision rows; records the idempotency result;
        and clears private preview staging JSON. Replaying the same user/key/request returns the same work with
        201. Reusing a key for another import or preview ETag returns 409. The import-rights statement is not a
        publication, sharing or sale license. Any failed database write rolls back all work/content rows.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          description: Preview ETag most recently reviewed by the user.
          schema:
            type: string
            maxLength: 45
            pattern: '^"[A-Za-z0-9_-]{43}"$'
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable per-user key for retrying the same import commit; restricted to safe ASCII characters.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9._~-]{16,128}$'
      responses:
        '201':
          description: Private work committed; replay with the same key returns the existing result.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
            Cache-Control:
