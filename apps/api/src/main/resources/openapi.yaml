openapi: 3.1.0
info:
  title: Novel Web API
  version: 6.35.0
  description: >-
    Contract for the Novel Web API. System status and health are implemented in the local foundation.
    Google sign-in/session, policy-document/acceptance, library/work list and personal library-state routes are
    implemented only in the configured PostgreSQL profile. The import-rights statement read and acceptance routes
    are also implemented in that profile; private job creation and local staging upload are now implemented too.
    Import staging applies actor-scoped active-job/declared-byte quotas and persistent create/upload token buckets;
    HTML documents have a 4 MiB source limit and Markdown has a 16 MiB source limit, both lower than the configured general upload limit.
    EPUB 3, bounded UTF-8 TXT and single-document HTML/Markdown parse queue/status, private-preview persistence/edit and atomic private import
    commit are implemented. Markdown uses CommonMark core only, strips raw HTML and link destinations, and derives chapter boundaries from repeated top-level headings.
    Source-only Reader manifest, chapter-content, progress, reader-preferences, bookmarks, private annotations and private reading-history routes are implemented in the PostgreSQL profile.
    History is derived from the latest saved progress per accessible readable work, is visible for 365 days, and never returns chapter body text.
    Versioned cultivation catalogs, authenticated profile settings, private daily XP activity and bounded private Reader sessions with atomic XP awards are implemented in the PostgreSQL profile. The approved starting policy awards 1 XP per complete active Reader minute, capped at 120 XP per UTC day; same-day sub-minute remainder does not cross UTC midnight; top-ups and unlocks award none. Cultivation is feature-gated and off by default pending the rank-threshold pilot and release reviews.
    Scoped glossary storage, actor-scoped catalog listing/creation, active and writer-only latest-revision reads, version-checked immutable draft creation, authenticated diff/lint/match preview, lint-gated revision publication with append-only audit, strict JSON/CSV/TSV import preview and resolved atomic draft apply, and active/writer-only latest snapshot export are implemented in the PostgreSQL profile. Translation job enqueue/status/retry/cancel are available only as an explicit fake-local development preview and never call an external NMT provider. `features.translationFakePreviewEnabled` is true only when both required profiles and the provider/API/worker opt-in flags are active.
    The authenticated PostgreSQL profile also exposes the current actor's available paid and non-expired bonus credit totals from the rebuildable balance projection; the response is no-store and does not expose another account's ledger.
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: System
    description: Implemented read-only status and health operations.
  - name: Auth
    description: Google GIS, session and required policy routes are available only in the PostgreSQL profile; other Auth operations remain planned.
    x-implementation-status: partial
  - name: Library
    description: Library/work listing, personal reading-state/collection, import-rights and local upload-staging operations are available in the PostgreSQL profile; parsing and other operations remain planned for G2.
    x-implementation-status: partial
  - name: Reader
    description: Source-only reader, progress, preferences, private bookmarks, source annotations and private reading history are available in the PostgreSQL profile.
    x-implementation-status: partial
  - name: Progression
    description: Private rank catalog/profile, bounded Reader-session lifecycle and feature-gated server-timed XP awards/activity in the PostgreSQL profile.
    x-implementation-status: partial
  - name: Glossary
    description: Actor-scoped catalog listing/creation, active-revision reads, immutable drafts, publication and resolved import apply are implemented in the PostgreSQL profile.
    x-implementation-status: partial
  - name: Translation
    description: Explicitly opted-in fake-local translation job lifecycle; external providers, reviewer publication and paid usage are unavailable.
    x-implementation-status: local-preview
  - name: Authoring
    description: Private-first author manuscript drafts with owner-only chapter content and immutable revisions; collaboration and publication are not available.
    x-implementation-status: partial
  - name: Commerce
    description: Actor-owned read-only credit balance is implemented; credit purchases, provider confirmation, credit grants and chapter unlocks remain gated or planned.
    x-implementation-status: partial
paths:
  /api/v1/glossaries:
    get:
      operationId: listGlossaries
      tags: [Glossary]
      x-implementation-status: implemented-postgres-profile
      summary: List visible glossaries
      description: >-
        Returns glossary metadata visible to the current actor: owned USER_GLOBAL glossaries and glossary scopes
        attached to libraries the actor can read. Each item includes canWrite, derived from the same server-side
        ownership/workspace role policy used by glossary mutations. This is a UI capability hint; every mutation
        still rechecks current authorization. Results are ordered by creation time descending, then ID descending.
        Optional scope, libraryId and name query filters are bound into an actor- and access-scope-bound signed keyset
        cursor. Page size is at most 100. A filtered library ID that is missing or inaccessible returns an empty page.
        Current Terms and Privacy acceptance is required; responses use no-store caching.
      security:
        - appSession: []
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [USER_GLOBAL, LIBRARY, WORK, VOLUME, CHAPTER]
        - name: libraryId
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Case-insensitive glossary-name substring; normalized to NFC and limited to 160 characters.
          schema:
            type: string
            maxLength: 160
        - name: cursor
          in: query
          description: Opaque signed keyset cursor bound to actor, filters and current workspace access scope.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: One bounded page of visible glossary metadata.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryCatalogPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createGlossary
      tags: [Glossary]
      x-implementation-status: implemented-postgres-profile
      summary: Create an empty glossary container
      description: >-
        Creates glossary metadata for one supported scope. The actor is derived from the session. USER_GLOBAL is
        owner-only; library/work/volume/chapter scopes require write access to the exact library and a matching target
        hierarchy. Current Terms and Privacy acceptance and session-bound CSRF are required. Creation starts at
        version 1 with no active revision; the caller can use its ETag to create the first immutable draft through
        POST /api/v1/glossaries/{glossaryId}/revisions. It does not publish an empty revision.
      security:
        - appSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGlossaryRequest'
      responses:
        '201':
          description: Glossary metadata created at version 1, without an active revision.
          headers:
            ETag:
              required: true
              schema:
                type: string
                pattern: '^"v1"$'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryCatalogItem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/glossaries/{glossaryId}:
    get:
      operationId: getGlossaryMetadata
      tags: [Glossary]
      x-implementation-status: implemented-postgres-profile
      summary: Read visible glossary metadata by ID
      description: >-
        Returns metadata for one glossary visible to the current actor, including the server-computed canWrite
        presentation hint, the published active revision number, and the latest revision number when the actor can
        write. Readers never receive the unpublished draft revision number. Missing and inaccessible IDs share the
        same 404 response. The hint does not authorize later writes; every mutation rechecks current ownership or
        workspace role. Current Terms and Privacy acceptance is required; responses use no-store caching.
      security:
        - appSession: []
      parameters:
        - name: glossaryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Visible glossary metadata.
          headers:
            ETag:
              required: true
              description: Strong ETag for the current glossary version; use it for a later If-Match write.
              schema:
                type: string
                pattern: '^"v[1-9][0-9]{0,18}"$'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryCatalogItem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/glossaries/{glossaryId}/revisions:
    post:
      operationId: createGlossaryDraftRevision
      tags: [Glossary]
      x-implementation-status: implemented-postgres-profile
      summary: Create an immutable glossary draft revision
      description: >-
        Creates one complete draft snapshot for the current authenticated actor. USER_GLOBAL glossaries require their
        owner; library/work/volume/chapter glossaries require library write access. The glossary version in If-Match
        is checked atomically. The returned ETag is the next glossary version. The draft's parent is the latest revision,
        while activeRevisionId remains unchanged until a separate publish action is implemented. Drafts contain at most
        1000 terms and at most 5000 aliases total, with no more than 25 aliases per term. Current Terms and Privacy
        acceptance and the session-bound CSRF token are required.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: glossaryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          description: Strong ETag returned by the current glossary representation.
          schema:
            type: string
            pattern: '^"v[1-9][0-9]{0,18}"$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGlossaryDraftRequest'
      responses:
        '201':
          description: Immutable draft created; it is not the active revision.
          headers:
            ETag:
              required: true
              schema:
                type: string
                pattern: '^"v[1-9][0-9]*"$'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryDraftCreated'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The glossary version changed; ETag contains the current version.
          headers:
            ETag:
              required: true
              schema:
                type: string
                pattern: '^"v[1-9][0-9]*"$'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/glossaries/{glossaryId}/revisions/{revisionId}/preview:
    post:
      operationId: previewGlossaryRevision
      tags: [Glossary]
      x-implementation-status: implemented-postgres-profile
      summary: Preview a glossary draft diff, lint and sample matches
      description: >-
        Returns the bounded diff against the immutable parent, lint findings and optional source-text matches for the
        latest unpublished draft. Requires current glossary-writer access, accepted Terms/Privacy policy, session-bound
        CSRF and the current strong glossary If-Match ETag. The sample source is limited to 4,000 Unicode code points;
        at most 100 term changes, 50 lint findings, 100 matches and 50 conflicts are returned with full counts and
        truncation flags. `canPublish` reflects the global lint gate; sample-specific match conflicts are diagnostic
        and do not alone block publication. Publish rechecks the current snapshot and lint. This operation performs no
        writes and never publishes the revision.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: glossaryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          description: Strong ETag returned by the current glossary representation.
          schema:
            type: string
            pattern: '^"v[1-9][0-9]{0,18}"$'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlossaryRevisionPreviewRequest'
      responses:
        '200':
          description: Bounded preview for the latest unpublished draft; no state was changed.
          headers:
            ETag:
              required: true
              schema:
                type: string
                pattern: '^"v[1-9][0-9]*"$'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryRevisionPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The glossary ETag is stale, the revision is not latest, or it is already active.
          headers:
            ETag:
              required: true
              schema:
                type: string
                pattern: '^"v[1-9][0-9]*"$'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/glossaries/{glossaryId}/revisions/{revisionId}/publish:
    post:
      operationId: publishGlossaryRevision
      tags: [Glossary]
      x-implementation-status: implemented-postgres-profile
      summary: Publish the latest valid glossary revision
      description: >-
        Publishes only the latest immutable revision after server-side lint succeeds. USER_GLOBAL glossaries require
        their owner; library/work/volume/chapter glossaries require library write access. The operation requires a
        strong If-Match glossary version, current Terms and Privacy acceptance and the session-bound CSRF token.
        The active-revision pointer, glossary version and append-only publication event commit in one transaction.
        Repeating a publish for the already-active revision is an idempotent success and does not add an audit event.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: glossaryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          description: Strong ETag returned by the current glossary representation.
          schema:
            type: string
            pattern: '^"v[1-9][0-9]{0,18}"$'
      responses:
        '200':
          description: The revision is active; repeating the same publication does not create another event.
          headers:
            ETag:
              required: true
              schema:
                type: string
                pattern: '^"v[1-9][0-9]*"$'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryRevisionPublished'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The glossary ETag is stale or the requested revision is no longer latest.
          headers:
            ETag:
              required: true
              schema:
                type: string
                pattern: '^"v[1-9][0-9]*"$'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Lint errors prevent publication; at most 50 issues are included.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GlossaryPublishProblem'
        '428':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/glossaries/{glossaryId}/terms/import-preview:
    post:
      operationId: previewGlossaryImport
      tags: [Glossary]
      x-implementation-status: implemented-postgres-profile
      summary: Validate a glossary file and preview current revision conflicts
      description: >-
        Reads at most 1 MiB of UTF-8 JSON, CSV or TSV and returns a normalized import proposal and safe conflict
        suggestions against the latest immutable draft snapshot. The response separately identifies the active revision
        and the latest draft used as the import base. It never writes a revision or changes the glossary. JSON uses
        version 1 with a terms array. CSV/TSV require sourceTerm and targetTerm headers; aliases, when present, are a
        JSON array encoded in one delimited cell. The caller must resolve updates/pattern collisions and then submit a
        complete immutable draft with POST /revisions using the returned ETag. Translation-unit impact is explicitly
        unavailable until the translation pipeline exists.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: glossaryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          description: Strong ETag returned by the current glossary representation.
          schema:
            type: string
            pattern: '^"v[1-9][0-9]{0,18}"$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlossaryImportFile'
          text/csv:
            schema:
              type: string
              format: binary
              description: UTF-8 CSV with the documented header and field rules.
          text/tab-separated-values:
            schema:
              type: string
              format: binary
              description: UTF-8 TSV with the documented header and field rules.
      responses:
        '200':
          description: Parsed proposal and current glossary state; no data was written.
          headers:
            ETag:
              required: true
              schema:
                type: string
                pattern: '^"v[1-9][0-9]*"$'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryImportPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The glossary ETag is stale; the current version is returned in ETag.
          headers:
            ETag:
              required: true
              schema:
                type: string
                pattern: '^"v[1-9][0-9]*"$'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          description: The file is malformed or contains invalid rows; no partial import is returned.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GlossaryImportProblem'
        '428':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/glossaries/{glossaryId}/terms/import-apply:
    post:
      operationId: applyResolvedGlossaryImport
      tags: [Glossary]
      x-implementation-status: implemented-postgres-profile
      summary: Apply resolved import rows as one immutable draft
      description: >-
        Re-parses the bounded original JSON, CSV or TSV file, verifies that the caller supplied exactly one explicit
        ADD, REPLACE, MERGE or SKIP decision for each parsed row, and rechecks current conflicts against the
        authorized writable snapshot. REPLACE preserves the unique canonical-match term ID; MERGE preserves the
        selected current term ID and uses the submitted complete resolved field set; ADD assigns a server-generated
        stable ID; SKIP keeps the current snapshot unchanged for that row. The final complete snapshot is written in
        one transaction as a new immutable draft and never activated. Missing, stale, malformed, truncated or still
        conflicting decisions write nothing. The actor-scoped Idempotency-Key stores the exact request hash and the
        created revision/result in the same transaction. Replaying the same request with the same key returns the
        original result; using the key for different bytes returns 409. The original file is base64-encoded in this
        JSON envelope and limited to 1 MiB; the complete request is limited to 2 MiB.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: glossaryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          description: Strong ETag returned by the glossary import preview.
          schema:
            type: string
            pattern: '^"v[1-9][0-9]{0,18}"$'
        - name: Idempotency-Key
          in: header
          required: true
          description: Reuse this key only to retry the exact same request body for this actor and glossary.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9._~-]{16,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlossaryImportApplyRequest'
      responses:
        '201':
          description: One complete immutable draft was created; it is not active.
          headers:
            ETag:
              required: true
              schema:
                type: string
                pattern: '^"v[1-9][0-9]*"$'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryImportApplyResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The glossary version changed or this idempotency key was used for another request.
          headers:
            ETag:
              required: true
              schema:
                type: string
                pattern: '^"v[1-9][0-9]*"$'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          description: The file, row decisions or final conflict checks failed; no revision was written.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GlossaryImportApplyProblem'
        '428':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/glossaries/{glossaryId}/export:
    get:
      operationId: exportGlossaryRevision
      tags: [Glossary]
      x-implementation-status: implemented-postgres-profile
      summary: Download one authorized immutable glossary revision
      description: >-
        Exports the active revision by default, or the latest immutable revision when revision=latest. Active snapshots
        are available to actors with read access; latest snapshots are writer-only and an inaccessible latest draft is
        concealed as 404. Current Terms and Privacy acceptance is required. JSON is version-1 and losslessly matches
        the glossary import schema. CSV and TSV use the import header and JSON-array aliases; spreadsheet-formula-like
        cells are prefixed with an apostrophe for spreadsheet safety, so use JSON for exact round trips. The response
        is an attachment, includes the current glossary-version ETag and is no-store. This safe GET does not require CSRF.
      security:
        - appSession: []
      parameters:
        - name: glossaryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          description: Defaults to JSON; CSV/TSV are spreadsheet-safe and may add an apostrophe to formula-like cells.
          schema:
            type: string
            enum: [json, csv, tsv]
            default: json
        - name: revision
          in: query
          required: false
          description: Defaults to the published active snapshot. The latest draft is restricted to writers.
          schema:
            type: string
            enum: [active, latest]
            default: active
      responses:
        '200':
          description: Import-compatible glossary file download.
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
            ETag:
              required: true
              schema:
                type: string
                pattern: '^"v[1-9][0-9]*"$'
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryImportFile'
            text/csv:
              schema:
                type: string
                format: binary
            text/tab-separated-values:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/glossaries/{glossaryId}/active-revision:
    get:
