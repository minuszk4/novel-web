openapi: 3.1.0
info:
  title: Novel Web API
  version: 10.0.0
  description: >-
    Contract for the Novel Web API. System status and health are implemented in the local foundation.
    Google sign-in/session, policy-document/acceptance, library/work list and personal library-state routes are
    implemented only in the configured PostgreSQL profile. The import-rights statement read and acceptance routes
    are also implemented in that profile; private job creation and local staging upload are now implemented too.
    Import staging applies actor-scoped active-job/declared-byte quotas and persistent create/upload token buckets;
    HTML documents have a 4 MiB source limit and Markdown has a 16 MiB source limit, both lower than the configured general upload limit.
    EPUB 3, bounded UTF-8 TXT and single-document HTML/Markdown parse queue/status, private-preview persistence/edit and atomic private import
    commit are implemented. Markdown uses CommonMark core only, strips raw HTML and link destinations, and derives chapter boundaries from repeated top-level headings.
    Source-only Reader manifest, chapter-content, progress, reader-preferences, bookmarks, private annotations and private reading-history routes are implemented in the PostgreSQL profile.
    History is derived from the latest saved progress per accessible readable work, is visible for 365 days, and never returns chapter body text.
    Versioned cultivation catalogs, authenticated profile settings, private daily XP activity and bounded private Reader sessions with atomic XP awards are implemented in the PostgreSQL profile. The approved starting policy awards 1 XP per complete active Reader minute, capped at 120 XP per UTC day; same-day sub-minute remainder does not cross UTC midnight; top-ups and unlocks award none. Cultivation is feature-gated and off by default pending the rank-threshold pilot and release reviews.
    Scoped glossary storage, actor-scoped catalog listing/creation, active and writer-only latest-revision reads, version-checked immutable draft creation, authenticated diff/lint/match preview, lint-gated revision publication with append-only audit, strict JSON/CSV/TSV import preview and resolved atomic draft apply, and active/writer-only latest snapshot export are implemented in the PostgreSQL profile. Translation job enqueue/status/retry/cancel are available only as an explicit fake-local development preview and never call an external NMT provider. Manual translation readiness/submission plus assigned-reviewer queue, frozen-snapshot detail and append-only accept/reject decisions are available only behind `NOVEL_TRANSLATION_REVIEW_ENABLED`; the flag defaults off. Writer and reviewer UI are implemented behind the default-off manual-review gate; translation publication and rollback remain open. `features.translationFakePreviewEnabled` is true only when both required profiles and the provider/API/worker opt-in flags are active.
    The authenticated PostgreSQL profile also exposes the current actor's available paid and non-expired bonus credit totals from the rebuildable balance projection; the response is no-store and does not expose another account's ledger. When the MoMo TEST gate is explicitly enabled with valid TEST configuration, the profile also exposes server-priced public-chapter unlock quotes and an idempotent paid-credit unlock that commits the debit with an immutable entitlement; private/draft chapters remain unavailable and no production purchase is enabled.
    An opt-in, metadata-only guest catalog endpoint is available in the PostgreSQL profile. It is disabled by default and returns only authored, active, explicitly public works owned by active users with at least one ready chapter; it does not return descriptions or chapter bodies. Admin-only publication-reviewer role assignment, bounded eligible-account search and status-filtered assignment history are implemented in the PostgreSQL profile; the current-user response exposes the caller's server-derived security capability for navigation only. Author-owned private drafts can read the current effective publication-rights policy, record a work-scoped acknowledgement and submit an immutable rights-review request with scoped declarations. Submission is owner-only, CSRF-protected, snapshot-checked, bounded and persistently rate-limited. Active reviewers can read an actor-bound pending queue and privacy-filtered request snapshot, then append needs-information, reject or approve decisions with exact idempotency and current ETag checks; approval only grants immutable scope access and leaves the work unpublished. An owner-only immediate release route exists behind `NOVEL_PUBLICATION_RELEASE_ENABLED`, which remains off by default and is reported through server feature status; it rechecks current approval and snapshots when the owner confirms release. The API does not bootstrap system administrators, let authors define policy or self-review. Public follow, notifications, scheduled release, owner unpublish, edge rate limits and guest reader access remain separate work.
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: System
    description: Implemented read-only status and health operations.
  - name: Auth
    description: Google GIS, session and required policy routes are available only in the PostgreSQL profile; other Auth operations remain planned.
    x-implementation-status: partial
  - name: Library
    description: Library/work listing, personal reading-state/collection, import-rights and local upload-staging operations are available in the PostgreSQL profile; parsing and other operations remain planned for G2.
    x-implementation-status: partial
  - name: Catalog
    description: Opt-in metadata-only guest catalog; public release and guest chapter reading remain unavailable.
    x-implementation-status: partial
  - name: Admin security
    description: Admin-only publication reviewer role assignment/search/history routes; first-admin bootstrap uses a separate operator command, and publication itself remains unavailable.
    x-implementation-status: partial
  - name: Reader
    description: Source-only reader, progress, preferences, private bookmarks, source annotations and private reading history are available in the PostgreSQL profile.
    x-implementation-status: partial
  - name: Progression
    description: Private rank catalog/profile, bounded Reader-session lifecycle and feature-gated server-timed XP awards/activity in the PostgreSQL profile.
    x-implementation-status: partial
  - name: Glossary
    description: Actor-scoped catalog listing/creation, active-revision reads, immutable drafts, publication and resolved import apply are implemented in the PostgreSQL profile.
    x-implementation-status: partial
  - name: Translation
    description: Explicitly opted-in fake-local lifecycle and separately disabled manual-review API; external providers, translation publication and paid usage are unavailable.
    x-implementation-status: local-preview
  - name: Translation review
    description: Gated manual-only readiness, submission, assigned-reviewer queue/detail and append-only decisions; local writer/reviewer UI is also gated; translation publication is not implemented.
    x-implementation-status: local-preview
  - name: Authoring
    description: Private-first owner manuscript drafts and content. Owners can submit immutable rights-review records.
    x-implementation-status: partial
  - name: Publication review
    description: Assigned reviewers can read pending requests and a privacy-filtered immutable snapshot; decision and publishing APIs remain unavailable.
    x-implementation-status: partial
  - name: Commerce
    description: Actor-owned credit balance/history, MoMo TEST-only feature-gated pack checkout/order status/IPN settlement and paid-credit chapter unlock are implemented; payment-order history, missing-IPN reconciliation, purchase history UI and production payment remain unavailable.
    x-implementation-status: partial
paths:
  /api/v1/admin/security/role-assignments:
    get:
      operationId: listPublicationReviewerAssignments
      tags: [Admin security]
      x-implementation-status: implemented-postgres-profile
      summary: List publication reviewer assignments
      description: >-
        Requires a current active system_admin assignment. Returns active, revoked or all publication_reviewer
        assignments according to the bounded status filter. Verified email addresses are masked in the response.
        The response is no-store. This route cannot grant or reveal system_admin assignments.
      security:
        - appSession: []
      parameters:
        - name: role
          in: query
          required: true
          schema:
            type: string
            const: publication_reviewer
        - name: status
          in: query
          required: false
          description: Assignment history filter; defaults to active.
          schema:
            type: string
            enum: [active, revoked, all]
            default: active
      responses:
        '200':
          description: Current reviewer assignments.
          headers:
            Cache-Control:
              schema:
                type: string
                pattern: '.*no-store.*'
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewerAssignmentList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/security/users/search:
    post:
      operationId: searchEligibleReviewerAccounts
      tags: [Admin security]
      x-implementation-status: implemented-postgres-profile
      summary: Search active accounts eligible for reviewer assignment
      description: >-
        Requires a current active system_admin assignment and session CSRF. Accepts an account UUID or a bounded
        email prefix in the JSON body; only active users are returned and email addresses must be verified before
        matching. Results are capped at 20 and returned with a masked email. The query is never placed in a URL.
        The response is no-store and contains no manuscript or session data.
      security:
        - appSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewerAccountSearchRequest'
      responses:
        '200':
          description: Matching active accounts, bounded to 20 results.
          headers:
            Cache-Control:
              schema:
                type: string
                pattern: '.*no-store.*'
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewerAccountSearchResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/security/users/{userId}/roles/publication_reviewer:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: grantPublicationReviewerRole
      tags: [Admin security]
      x-implementation-status: implemented-postgres-profile
      summary: Grant the publication reviewer role
      description: >-
        Requires a current active system_admin assignment, a CSRF token and a valid Idempotency-Key. Only an active
        target account may receive the role. Self-assignment and request-supplied roles/actors are rejected. Grant
        and audit event commit atomically; repeat requests replay or return the existing assignment. No system_admin
        role can be granted through this API.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9._~-]{16,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantPublicationReviewerRequest'
      responses:
        '200':
          description: The role was already active; no duplicate audit event was created.
          headers:
            Cache-Control:
              schema:
                type: string
                pattern: '.*no-store.*'
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentCommand'
        '201':
          description: The role was granted and an immutable audit event was appended.
          headers:
            Cache-Control:
              schema:
                type: string
                pattern: '.*no-store.*'
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentCommand'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: revokePublicationReviewerRole
      tags: [Admin security]
      x-implementation-status: implemented-postgres-profile
      summary: Revoke the publication reviewer role
      description: >-
        Requires a current active system_admin assignment, a CSRF token, a bounded revocation reason and a valid
        Idempotency-Key. Revocation updates the current assignment and appends an immutable event in one transaction;
        it takes effect before this route succeeds. Repeating the same request is safe.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9._~-]{16,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokePublicationReviewerRequest'
      responses:
        '204':
          description: The reviewer role was revoked or was already inactive.
          headers:
            Cache-Control:
              schema:
                type: string
                pattern: '.*no-store.*'
            Pragma:
              schema:
                type: string
                const: no-cache
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/catalog/works:
    get:
      operationId: listPublicCatalogWorks
      tags: [Catalog]
      x-implementation-status: implemented-postgres-profile
      summary: List explicitly public authored works
      description: >-
        Anonymous metadata-only catalog. Returns active authored works whose visibility is public, whose owner is
        active and which have at least one ready chapter with a source revision. Private, unlisted, imported, archived,
        deleted and chapterless works are excluded. Search matches title and author only; it never searches chapter
        content. Results sort by createdAt descending and ID descending with a signed keyset cursor bound to the
        normalized query and language filter. The server feature flag defaults off and readiness requires a valid
        server-side per-client rate-limit HMAC key. The API token bucket allows 60 burst requests and refills at one
        request per second; it returns 429 with Retry-After when exhausted and fails closed if the limiter is unavailable.
        The limiter uses the socket peer unless X-Forwarded-For comes through configured trusted proxies. Keep the
        feature off until rights review and publication controls are approved; deployment edge limits are still required.
      security: []
      parameters:
        - name: q
          in: query
          description: Case-insensitive title/author substring; NFKC-normalized and limited to 120 Unicode code points.
          schema:
            type: string
            maxLength: 120
        - name: language
          in: query
          description: Optional source-language tag filter.
          schema:
            type: string
            maxLength: 35
            pattern: '^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$'
        - name: cursor
          in: query
          description: Opaque signed keyset cursor bound to the normalized query, language and sort order.
          schema:
            type: string
            maxLength: 2048
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: One bounded page of public work metadata.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCatalogPage'
        '400':
          description: Invalid query, language, limit or filter-bound cursor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Per-client catalog request bucket is exhausted.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Feature disabled, limiter unavailable, database unavailable or cursor signing is not configured.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/glossaries:
    get:
      operationId: listGlossaries
      tags: [Glossary]
      x-implementation-status: implemented-postgres-profile
      summary: List visible glossaries
      description: >-
        Returns glossary metadata visible to the current actor: owned USER_GLOBAL glossaries and glossary scopes
        attached to libraries the actor can read. Each item includes canWrite, derived from the same server-side
        ownership/workspace role policy used by glossary mutations. This is a UI capability hint; every mutation
        still rechecks current authorization. Results are ordered by creation time descending, then ID descending.
        Optional scope, libraryId and name query filters are bound into an actor- and access-scope-bound signed keyset
        cursor. Page size is at most 100. A filtered library ID that is missing or inaccessible returns an empty page.
        Current Terms and Privacy acceptance is required; responses use no-store caching.
      security:
        - appSession: []
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [USER_GLOBAL, LIBRARY, WORK, VOLUME, CHAPTER]
        - name: libraryId
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Case-insensitive glossary-name substring; normalized to NFC and limited to 160 characters.
          schema:
            type: string
            maxLength: 160
        - name: cursor
          in: query
          description: Opaque signed keyset cursor bound to actor, filters and current workspace access scope.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: One bounded page of visible glossary metadata.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryCatalogPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createGlossary
      tags: [Glossary]
      x-implementation-status: implemented-postgres-profile
      summary: Create an empty glossary container
      description: >-
        Creates glossary metadata for one supported scope. The actor is derived from the session. USER_GLOBAL is
        owner-only; library/work/volume/chapter scopes require write access to the exact library and a matching target
        hierarchy. Current Terms and Privacy acceptance and session-bound CSRF are required. Creation starts at
        version 1 with no active revision; the caller can use its ETag to create the first immutable draft through
        POST /api/v1/glossaries/{glossaryId}/revisions. It does not publish an empty revision.
      security:
        - appSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGlossaryRequest'
      responses:
        '201':
          description: Glossary metadata created at version 1, without an active revision.
          headers:
            ETag:
              required: true
              schema:
                type: string
                pattern: '^"v1"$'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryCatalogItem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/glossaries/{glossaryId}:
    get:
      operationId: getGlossaryMetadata
      tags: [Glossary]
      x-implementation-status: implemented-postgres-profile
      summary: Read visible glossary metadata by ID
      description: >-
        Returns metadata for one glossary visible to the current actor, including the server-computed canWrite
        presentation hint, the published active revision number, and the latest revision number when the actor can
        write. Readers never receive the unpublished draft revision number. Missing and inaccessible IDs share the
        same 404 response. The hint does not authorize later writes; every mutation rechecks current ownership or
        workspace role. Current Terms and Privacy acceptance is required; responses use no-store caching.
      security:
        - appSession: []
      parameters:
        - name: glossaryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Visible glossary metadata.
          headers:
            ETag:
              required: true
              description: Strong ETag for the current glossary version; use it for a later If-Match write.
              schema:
                type: string
                pattern: '^"v[1-9][0-9]{0,18}"$'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryCatalogItem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/glossaries/{glossaryId}/revisions:
    post:
      operationId: createGlossaryDraftRevision
      tags: [Glossary]
      x-implementation-status: implemented-postgres-profile
      summary: Create an immutable glossary draft revision
      description: >-
        Creates one complete draft snapshot for the current authenticated actor. USER_GLOBAL glossaries require their
        owner; library/work/volume/chapter glossaries require library write access. The glossary version in If-Match
        is checked atomically. The returned ETag is the next glossary version. The draft's parent is the latest revision,
        while activeRevisionId remains unchanged until a separate publish action is implemented. Drafts contain at most
        1000 terms and at most 5000 aliases total, with no more than 25 aliases per term. Current Terms and Privacy
        acceptance and the session-bound CSRF token are required.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: glossaryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          description: Strong ETag returned by the current glossary representation.
          schema:
            type: string
            pattern: '^"v[1-9][0-9]{0,18}"$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGlossaryDraftRequest'
      responses:
        '201':
          description: Immutable draft created; it is not the active revision.
          headers:
            ETag:
              required: true
              schema:
                type: string
                pattern: '^"v[1-9][0-9]*"$'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryDraftCreated'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The glossary version changed; ETag contains the current version.
          headers:
            ETag:
              required: true
              schema:
                type: string
                pattern: '^"v[1-9][0-9]*"$'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/glossaries/{glossaryId}/revisions/{revisionId}/preview:
    post:
      operationId: previewGlossaryRevision
      tags: [Glossary]
      x-implementation-status: implemented-postgres-profile
      summary: Preview a glossary draft diff, lint and sample matches
      description: >-
        Returns the bounded diff against the immutable parent, lint findings and optional source-text matches for the
        latest unpublished draft. Requires current glossary-writer access, accepted Terms/Privacy policy, session-bound
        CSRF and the current strong glossary If-Match ETag. The sample source is limited to 4,000 Unicode code points;
        at most 100 term changes, 50 lint findings, 100 matches and 50 conflicts are returned with full counts and
        truncation flags. `canPublish` reflects the global lint gate; sample-specific match conflicts are diagnostic
        and do not alone block publication. Publish rechecks the current snapshot and lint. This operation performs no
        writes and never publishes the revision.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: glossaryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          description: Strong ETag returned by the current glossary representation.
          schema:
            type: string
            pattern: '^"v[1-9][0-9]{0,18}"$'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlossaryRevisionPreviewRequest'
      responses:
        '200':
          description: Bounded preview for the latest unpublished draft; no state was changed.
          headers:
            ETag:
              required: true
              schema:
                type: string
                pattern: '^"v[1-9][0-9]*"$'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryRevisionPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The glossary ETag is stale, the revision is not latest, or it is already active.
          headers:
            ETag:
              required: true
              schema:
                type: string
                pattern: '^"v[1-9][0-9]*"$'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/glossaries/{glossaryId}/revisions/{revisionId}/publish:
    post:
      operationId: publishGlossaryRevision
      tags: [Glossary]
      x-implementation-status: implemented-postgres-profile
      summary: Publish the latest valid glossary revision
      description: >-
