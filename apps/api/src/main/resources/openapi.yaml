          type: [string, 'null']
          format: uuid
        segmentAnchor:
          type: [string, 'null']
          maxLength: 160
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$'
        scrollRatio:
          type: number
          minimum: 0
          maximum: 1
        version:
          type: integer
          minimum: 0
        updatedAt:
          type: [string, 'null']
          format: date-time
