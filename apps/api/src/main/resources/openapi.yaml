        PostgreSQL parser job. A separate worker rechecks the digest and content safety bounds, parses outside the
        request transaction and atomically stores a bounded private EPUB 3, UTF-8 TXT, single-document HTML or Markdown preview,
        based on the uploaded extension and immutable parser version. TXT becomes one chapter and emits TXT_SINGLE_CHAPTER;
        HTML becomes one chapter, strips active/non-content markup without executing or fetching it, and emits HTML_SINGLE_DOCUMENT.
