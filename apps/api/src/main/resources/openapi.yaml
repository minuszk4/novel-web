    post:
      operationId: applyResolvedGlossaryImport
      tags: [Glossary]
      x-implementation-status: implemented-postgres-profile
      summary: Apply resolved import rows as one immutable draft
      description: >-
        Re-parses the bounded original JSON, CSV or TSV file, verifies that the caller supplied exactly one explicit
        ADD, REPLACE, MERGE or SKIP decision for each parsed row, and rechecks current conflicts against the
        authorized writable snapshot. REPLACE preserves the unique canonical-match term ID; MERGE preserves the
        selected current term ID and uses the submitted complete resolved field set; ADD assigns a server-generated
        stable ID; SKIP keeps the current snapshot unchanged for that row. The final complete snapshot is written in
        one transaction as a new immutable draft and never activated. Missing, stale, malformed, truncated or still
        conflicting decisions write nothing. The actor-scoped Idempotency-Key stores the exact request hash and the
        created revision/result in the same transaction. Replaying the same request with the same key returns the
        original result; using the key for different bytes returns 409. The original file is base64-encoded in this
        JSON envelope and limited to 1 MiB; the complete request is limited to 2 MiB.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: glossaryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          description: Strong ETag returned by the glossary import preview.
          schema:
            type: string
            pattern: '^"v[1-9][0-9]{0,18}"$'
        - name: Idempotency-Key
          in: header
          required: true
          description: Reuse this key only to retry the exact same request body for this actor and glossary.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9._~-]{16,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlossaryImportApplyRequest'
      responses:
        '201':
          description: One complete immutable draft was created; it is not active.
          headers:
            ETag:
              required: true
              schema:
                type: string
                pattern: '^"v[1-9][0-9]*"$'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryImportApplyResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The glossary version changed or this idempotency key was used for another request.
          headers:
            ETag:
              required: true
              schema:
                type: string
                pattern: '^"v[1-9][0-9]*"$'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          description: The file, row decisions or final conflict checks failed; no revision was written.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GlossaryImportApplyProblem'
        '428':
