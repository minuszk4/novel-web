    PublicationReviewDetail:
      type: object
      additionalProperties: false
      required:
        - requestId
        - requestVersion
        - submittedAt
        - policyVersion
        - state
        - snapshotSha256
        - scopes
        - claims
        - events
      properties:
        requestId:
          type: string
          format: uuid
        requestVersion:
          type: integer
          minimum: 1
        submittedAt:
          type: string
          format: date-time
        policyVersion:
          type: string
          maxLength: 64
        state:
          type: string
          enum:
            - PENDING_REVIEW
            - NEEDS_INFORMATION
            - APPROVED_UNPUBLISHED
            - REJECTED
            - SUPERSEDED
            - WITHDRAWN
        snapshotSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        scopes:
          type: array
          minItems: 2
          maxItems: 4
          items:
            $ref: '#/components/schemas/PublicationReviewScopePreview'
        claims:
          type: array
          minItems: 2
          maxItems: 4
          items:
            $ref: '#/components/schemas/PublicationReviewClaim'
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PublicationReviewEvent'
    PublicationReviewNeedsInformationRequest:
      type: object
      additionalProperties: false
      required: [actionCode, reasonCode]
      properties:
        actionCode:
          type: string
          const: NEEDS_INFORMATION
        reasonCode:
          type: string
          enum: [INCOMPLETE_CLAIM, MORE_INFORMATION, SCOPE_UNCLEAR]
    PublicationReviewApprovalRequest:
      type: object
      additionalProperties: false
      required: [actionCode, reasonCode]
      properties:
        actionCode:
          type: string
          const: APPROVED
        reasonCode:
          type: string
          enum: [RIGHTS_REVIEWED, SCOPE_CONFIRMED]
    PublicationReviewRejectionRequest:
      type: object
      additionalProperties: false
      required: [actionCode, reasonCode]
      properties:
        actionCode:
          type: string
          const: REJECTED
        reasonCode:
          type: string
          enum: [RIGHTS_NOT_VERIFIED, OUT_OF_SCOPE, POLICY_MISMATCH]
    PublicationReviewDecisionReceipt:
      type: object
      additionalProperties: false
      required:
        - eventSequence
        - actorRoleCode
        - actionCode
        - fromState
        - toState
        - reasonCode
        - decidedAt
      properties:
        eventSequence:
          type: integer
          minimum: 2
        actorRoleCode:
          type: string
          const: publication_reviewer
        actionCode:
          type: string
          enum: [NEEDS_INFORMATION, APPROVED, REJECTED]
        fromState:
          type: string
          const: PENDING_REVIEW
        toState:
          type: string
          enum: [NEEDS_INFORMATION, APPROVED_UNPUBLISHED, REJECTED]
        reasonCode:
          type: string
          enum:
            - INCOMPLETE_CLAIM
            - MORE_INFORMATION
            - SCOPE_UNCLEAR
            - RIGHTS_REVIEWED
            - SCOPE_CONFIRMED
            - RIGHTS_NOT_VERIFIED
            - OUT_OF_SCOPE
            - POLICY_MISMATCH
        decidedAt:
          type: string
          format: date-time
    PublicationReviewScopePreview:
      type: object
      additionalProperties: false
      required: [scopeCode, snapshotSha256, work, chapters]
      properties:
        scopeCode:
          type: string
          enum: [PUBLIC_METADATA, CHAPTER_TEXT, COMMERCIAL_SALE, TRANSLATION_ADAPTATION]
        snapshotSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        work:
          $ref: '#/components/schemas/PublicationReviewWorkPreview'
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/PublicationReviewChapterPreview'
    PublicationReviewWorkPreview:
      type: object
      additionalProperties: false
      required: [title, author, sourceLanguage]
      properties:
        title:
          type: string
          maxLength: 500
        author:
          type: string
          maxLength: 200
        sourceLanguage:
          type: string
          maxLength: 35
    PublicationReviewChapterPreview:
      type: object
      additionalProperties: false
      required: [ordinal, title, sourceLanguage, contentHash, segmentCount]
      properties:
        ordinal:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 500
        sourceLanguage:
          type: string
          maxLength: 35
        contentHash:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
        segmentCount:
          type: [integer, 'null']
          minimum: 0
    PublicationReviewClaim:
      type: object
      additionalProperties: false
      required: [scopeCode, rightsBasisCode]
      properties:
        scopeCode:
          type: string
          enum: [PUBLIC_METADATA, CHAPTER_TEXT, COMMERCIAL_SALE, TRANSLATION_ADAPTATION]
        rightsBasisCode:
          type: string
          enum: [ORIGINAL_WORK, LICENSE_OR_PERMISSION, PUBLIC_DOMAIN, NEEDS_REVIEW]
    PublicationReviewEvent:
      type: object
      additionalProperties: false
      required:
        - sequence
        - actorRoleCode
        - actionCode
        - fromState
        - toState
        - reasonCode
        - createdAt
      properties:
        sequence:
          type: integer
          minimum: 1
        actorRoleCode:
          type: string
          enum: [author, publication_reviewer]
        actionCode:
          type: string
          enum: [SUBMITTED, NEEDS_INFORMATION, APPROVED, REJECTED, SUPERSEDED, WITHDRAWN]
        fromState:
          type: [string, 'null']
          enum:
            - PENDING_REVIEW
            - NEEDS_INFORMATION
            - APPROVED_UNPUBLISHED
            - REJECTED
            - SUPERSEDED
            - WITHDRAWN
            - null
        toState:
          type: string
          enum:
            - PENDING_REVIEW
            - NEEDS_INFORMATION
            - APPROVED_UNPUBLISHED
            - REJECTED
            - SUPERSEDED
            - WITHDRAWN
        reasonCode:
          type: [string, 'null']
          enum:
            - INCOMPLETE_CLAIM
            - MORE_INFORMATION
            - SCOPE_UNCLEAR
            - RIGHTS_REVIEWED
            - SCOPE_CONFIRMED
            - RIGHTS_NOT_VERIFIED
            - OUT_OF_SCOPE
            - POLICY_MISMATCH
            - null
        createdAt:
          type: string
          format: date-time
    PublicationRightsAcceptanceRequest:
      type: object
      additionalProperties: false
      required: [policyVersion, confirmed]
      properties:
        policyVersion:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
          maxLength: 64
        confirmed:
          type: boolean
          const: true
    PublicationRightsAcceptance:
      type: object
      additionalProperties: false
      required: [id, policyVersion, policySha256, acceptedAt]
      properties:
        id:
          type: string
          format: uuid
        policyVersion:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
          maxLength: 64
        policySha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        acceptedAt:
          type: string
          format: date-time
    ImportRightsStatement:
      type: object
      additionalProperties: false
      required: [version, effectiveAt, displayText]
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 64
        effectiveAt:
          type: string
          format: date-time
        displayText:
          type: string
          minLength: 1
          maxLength: 8000
          description: Exact approved statement shown before any file bytes are uploaded or processed.
    ImportRightsAcceptanceRequest:
      type: object
      additionalProperties: false
      required: [statementVersion, confirmed]
      properties:
        statementVersion:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
          maxLength: 64
        confirmed:
          type: boolean
          const: true
    ImportRightsAcceptance:
      type: object
      additionalProperties: false
      required: [id, statementVersion, acceptedAt, statementSha256]
      properties:
        id:
          type: string
          format: uuid
        statementVersion:
          type: string
          maxLength: 64
        acceptedAt:
          type: string
          format: date-time
        statementSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 of the exact UTF-8 display text acknowledged by the caller.
    CreateImportRequest:
      type: object
      additionalProperties: false
      required: [libraryId, source, rightsAcceptanceId, rightsStatementVersion, rightsConfirmed]
      properties:
        libraryId:
          type: string
          format: uuid
        rightsAcceptanceId:
          type: string
          format: uuid
          description: One-time actor-bound receipt from POST /imports/rights-statement/acceptance; consumed atomically when the import job is created.
        source:
          $ref: '#/components/schemas/ImportSourceDescriptor'
        rightsStatementVersion:
          type: string
          minLength: 1
          maxLength: 64
        rightsConfirmed:
          type: boolean
          const: true
    ImportSourceDescriptor:
      type: object
      additionalProperties: false
      required: [kind, filename, contentType, sizeBytes]
      properties:
        kind:
          type: string
          const: upload
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: Display metadata only; not trusted as a path or file type.
        contentType:
          type: [string, 'null']
          maxLength: 160
          description: Browser-declared MIME hint; Markdown accepts text/markdown, text/x-markdown, text/plain or application/octet-stream, and all hints are checked against the file extension and bytes.
        sizeBytes:
          type: integer
          minimum: 1
          description: Declared size hint; the server enforces the configured cap and exact streamed byte count.
    ImportUploadTarget:
      type: object
      additionalProperties: false
      required: [method, url, headers, expiresAt]
      properties:
        method:
          type: string
          const: PUT
        url:
          type: string
          format: uri-reference
          description: Short-lived same-origin API path for the private upload target; do not log or persist the one-time token in headers.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Exact headers required by the API upload target, including the one-time token.
        expiresAt:
          type: string
          format: date-time
    ImportCreatedResponse:
      type: object
      additionalProperties: false
      required: [job, uploadTarget]
      properties:
        job:
          $ref: '#/components/schemas/ImportJob'
        uploadTarget:
          $ref: '#/components/schemas/ImportUploadTarget'
    ImportJob:
      type: object
      additionalProperties: false
      required: [id, status, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [upload_pending, uploaded, queued, scanning, parsing, ready_to_commit, committed, failed, cancelled, expired]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        warnings:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ImportWarning'
        failureCode:
          type: [string, 'null']
          maxLength: 96
        previewSummary:
          $ref: '#/components/schemas/ImportPreviewSummary'
    ImportWarning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          maxLength: 96
        message:
          type: string
          maxLength: 500
          description: Safe actionable text; never includes chapter body or raw parser internals.
    ImportPreviewSummary:
      type: object
      additionalProperties: false
      required: [title, author, chapterCount]
      properties:
        title:
          type: string
          maxLength: 300
        author:
          type: [string, 'null']
          maxLength: 200
        chapterCount:
          type: integer
          minimum: 0
    ImportPreview:
      type: object
      additionalProperties: false
      required: [importId, version, title, author, chapterCount, language, chapters, nextCursor, warnings]
      properties:
        importId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 300
        author:
          type: string
          maxLength: 200
        chapterCount:
          type: integer
          minimum: 0
        language:
          type: string
          maxLength: 35
        chapters:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ImportChapterPreview'
        nextCursor:
          type: [string, 'null']
          maxLength: 2048
        warnings:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ImportWarning'
    ImportChapterPreview:
      type: object
      additionalProperties: false
      required: [id, ordinal, title]
      properties:
        id:
          type: string
          format: uuid
        ordinal:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 300
    ImportPreviewPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        author:
          type: string
          maxLength: 200
        language:
          type: string
          maxLength: 35
        chapterOrder:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
    CultivationSettingsRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Explicit user opt-in; false pauses future progression without deleting earned history.
    CultivationActivityPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CultivationDailyActivity'
        nextCursor:
          anyOf:
            - type: string
              maxLength: 256
            - type: 'null'
          description: Signed cursor for the next older date, or null when no older rows remain.
    CultivationDailyActivity:
      type: object
      additionalProperties: false
      required: [activityDate, xpEarned]
      properties:
        activityDate:
          type: string
          format: date
          description: UTC date on which XP was recorded.
        xpEarned:
          type: integer
          format: int64
          minimum: 1
          description: XP earned on this UTC date; no story or chapter metadata is included.
    CultivationReadingSessionStartRequest:
      type: object
      additionalProperties: false
      required: [workId, chapterId, active]
      properties:
        workId:
          type: string
          format: uuid
        chapterId:
          type: string
          format: uuid
        active:
          type: boolean
          const: true
          description: Browser visibility/focus signal; the server does not trust client duration or timestamps.
    CultivationReadingSessionHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [sequence, active]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
          description: Consecutive client event number; gaps and stale sequence values return 409.
        active:
          type: boolean
          description: False pauses elapsed time when the Reader is hidden or blurred.
    CultivationReadingSessionStart:
      type: object
      additionalProperties: false
      required: [sessionId, state, startedAt, expiresAt, lastSequence, totalActiveSeconds, heartbeatIntervalSeconds, idleTimeoutSeconds]
      properties:
        sessionId:
          type: string
          format: uuid
        state:
          type: string
          const: active
        startedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastSequence:
          type: integer
          format: int64
          const: 0
        totalActiveSeconds:
          type: integer
          format: int64
          const: 0
        heartbeatIntervalSeconds:
          type: integer
          const: 30
        idleTimeoutSeconds:
          type: integer
          const: 90
    CultivationReadingSessionHeartbeat:
      type: object
      additionalProperties: false
      required: [sessionId, state, sequence, creditedSeconds, totalActiveSeconds, awardedXp, receivedAt, expiresAt]
      properties:
        sessionId:
          type: string
          format: uuid
        state:
          type: string
          const: active
        sequence:
          type: integer
          format: int64
        creditedSeconds:
          type: integer
          minimum: 0
          maximum: 60
        totalActiveSeconds:
          type: integer
          format: int64
          minimum: 0
        awardedXp:
          type: integer
          minimum: 0
          maximum: 120
          description: XP atomically posted by this accepted heartbeat; idempotent replays return the same award.
        receivedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    CultivationReadingSessionClose:
      type: object
      additionalProperties: false
      required: [sessionId, state, startedAt, closedAt, totalActiveSeconds, lastSequence, awardedXp]
      properties:
        sessionId:
          type: string
          format: uuid
        state:
          type: string
          enum: [closed, expired, revoked]
        startedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
        totalActiveSeconds:
          type: integer
          format: int64
          minimum: 0
        lastSequence:
          type: integer
          format: int64
          minimum: 0
        awardedXp:
          type: integer
          minimum: 0
          maximum: 120
          description: XP posted for the final eligible active interval when this session was closed.
    CultivationState:
      type: object
      additionalProperties: false
      required:
        [enabled, profileVersion, totalXp, todayXpEarned, currentRank, nextRank, xpToNextRank, progressRatio, rankCatalogVersion, policyVersion, locale, xpPerActiveMinute, dailyXpCap, nextDailyResetAt, rankCatalog]
      properties:
        enabled:
          type: boolean
        profileVersion:
          type: integer
          format: int64
          minimum: 0
          description: Zero represents a not-yet-created profile; repeated settings do not increment this version.
        totalXp:
          type: integer
          format: int64
          minimum: 0
        todayXpEarned:
          type: integer
          format: int64
          minimum: 0
          description: XP already posted to the immutable ledger for the current UTC date; the approved policy cap is 120.
        currentRank:
          $ref: '#/components/schemas/CultivationRank'
        nextRank:
          anyOf:
            - $ref: '#/components/schemas/CultivationRank'
            - type: 'null'
        xpToNextRank:
          type: integer
          format: int64
          minimum: 0
        progressRatio:
          type: number
          minimum: 0
          maximum: 1
        rankCatalogVersion:
          type: string
          maxLength: 32
        policyVersion:
          type: string
          maxLength: 32
        locale:
          type: string
          const: vi-VN
        xpPerActiveMinute:
          type: integer
          minimum: 1
        dailyXpCap:
          type: integer
          minimum: 1
        nextDailyResetAt:
          type: string
          format: date-time
          description: Next midnight UTC; display this exact server timestamp for the daily reset.
        rankCatalog:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CultivationRank'
    CultivationRank:
      type: object
      additionalProperties: false
      required: [key, group, name, thresholdXp, sortOrder]
      properties:
        key:
          type: string
          maxLength: 48
        group:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 100
        thresholdXp:
          type: integer
          format: int64
          minimum: 0
        sortOrder:
          type: integer
          minimum: 0
    CreditBalance:
      type: object
      additionalProperties: false
      required: [paidCredits, bonusCredits, totalCredits, asOf]
      properties:
        paidCredits:
          type: integer
          minimum: 0
          description: Available non-expiring paid credits.
        bonusCredits:
          type: integer
          minimum: 0
          description: Available bonus credits, excluding tranches expired at asOf.
        totalCredits:
          type: integer
          minimum: 0
          description: Sum of paidCredits and bonusCredits.
        asOf:
          type: string
          format: date-time
          description: Database snapshot time used to determine bonus-credit expiry.
    MomoTestPaymentNotification:
      type: object
      additionalProperties: true
      required:
        - amount
        - extraData
        - message
        - orderId
        - orderInfo
        - orderType
        - partnerCode
        - payType
        - requestId
        - responseTime
        - resultCode
        - transId
        - signature
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1000
          maximum: 50000000
        extraData:
          type: string
          const: ''
        message:
          type: string
          maxLength: 2048
        orderId:
          type: string
          minLength: 1
          maxLength: 200
          description: Saved credit top-up order UUID.
        orderInfo:
          type: string
          const: Novel Web credit top-up
        orderType:
          type: string
          const: momo_wallet
        partnerCode:
          type: string
          minLength: 1
          maxLength: 50
        payType:
          type: string
          maxLength: 128
        requestId:
          type: string
          minLength: 1
          maxLength: 50
          description: Saved unique request UUID for the payment order.
        responseTime:
          type: integer
          format: int64
          minimum: 1
        resultCode:
          type: integer
          format: int32
        transId:
          type: integer
          format: int64
          minimum: 0
        signature:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: Provider HMAC-SHA256 signature over MoMo's documented canonical fields.
    CreditHistoryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CreditTransaction'
        nextCursor:
          type: [string, 'null']
          maxLength: 256
          description: Actor-bound signed keyset cursor, or null when there is no next page.
    CreditTransaction:
      type: object
      additionalProperties: false
      required: [id, entryType, bucket, amountDelta, expiresAt, sourceType, occurredAt]
      properties:
        id:
          type: string
          format: uuid
          description: Opaque ledger-entry identifier.
        entryType:
          type: string
          enum: [TOP_UP, BONUS_GRANT, UNLOCK_DEBIT, ADJUSTMENT, REVERSAL]
        bucket:
          type: string
          enum: [PAID, BONUS]
        amountDelta:
          type: integer
          format: int64
          description: Signed credit change; positive adds credits and negative consumes or reverses them.
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: Bonus expiry when the entry applies to a bonus tranche; otherwise null.
        sourceType:
          type: string
          enum: [PAYMENT_ORDER, CHAPTER_UNLOCK, OPERATOR, REVERSAL]
          description: Safe source category only; internal source identifiers are not exposed.
        occurredAt:
          type: string
          format: date-time
          description: Ledger commit timestamp used for newest-first pagination.
    ChapterUnlockQuote:
      type: object
      additionalProperties: false
      required: [chapterId, workId, chapterTitle, workTitle, priceVersion, priceCredits, accessAlreadyGranted]
      properties:
        chapterId:
          type: string
          format: uuid
        workId:
          type: string
          format: uuid
        chapterTitle:
          type: string
          maxLength: 300
        workTitle:
          type: string
          maxLength: 300
        priceVersion:
          type: integer
          const: 1
        priceCredits:
          type: integer
          format: int64
          const: 10
        accessAlreadyGranted:
          type: boolean
    ChapterUnlockRequest:
      type: object
      additionalProperties: false
      required: [priceVersion]
      properties:
        priceVersion:
          type: integer
          minimum: 1
          description: Version shown by the current unlock quote; client-supplied amount is not accepted.
    ChapterUnlockResponse:
      type: object
      additionalProperties: false
      required: [outcome, entitlementId, chapterId, priceVersion, creditsSpent, grantedAt]
      properties:
        outcome:
          type: string
          enum: [CREATED, REPLAYED, ALREADY_OWNED, ALREADY_ACCESSIBLE]
        entitlementId:
          type: [string, 'null']
          format: uuid
          description: Null only when the actor already has library-based read access without a purchase.
        chapterId:
          type: string
          format: uuid
        priceVersion:
          type: integer
          minimum: 1
        creditsSpent:
          type: integer
          format: int64
          minimum: 0
          description: Zero for existing library access; otherwise the saved entitlement debit amount.
        grantedAt:
          type: [string, 'null']
          format: date-time
          description: Original entitlement timestamp, or null when no purchase entitlement is needed.
    CreditPackCatalog:
      type: object
      additionalProperties: false
      required: [environment, offers]
      properties:
        environment:
          type: string
          const: TEST
        offers:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CreditPack'
    CreditPack:
      type: object
      additionalProperties: false
      required: [packId, packVersion, environment, currency, amountVnd, paidCredits, bonusCredits, paidExpiresAt, bonusExpiresAt]
      properties:
        packId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        packVersion:
          type: integer
          minimum: 1
        environment:
          type: string
          const: TEST
        currency:
          type: string
          const: VND
        amountVnd:
          type: integer
          format: int64
          minimum: 1000
        paidCredits:
          type: integer
          format: int64
          minimum: 1
        bonusCredits:
          type: integer
          format: int64
          minimum: 0
