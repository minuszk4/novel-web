  /api/v1/payments/momo/ipn:
    post:
      operationId: receiveMomoTestPaymentNotification
      tags: [Commerce]
      x-implementation-status: test-only-feature-flag
      summary: Receive a signed MoMo TEST payment notification
      description: >-
        Server-to-server callback available only in the PostgreSQL profile when MoMo TEST has been explicitly
        enabled with validated TEST credentials and HTTPS callback settings. The server verifies the HMAC signature,
        matches the saved MoMo TEST order, request and VND amount, deduplicates the signed event, and appends the
        paid-credit grant atomically with the successful order transition. The order snapshots autoCapture=true;
        result code 9000 with a positive transaction ID is settled under MoMo's one-step rule, while a two-step
        order with autoCapture=false remains pending. Structurally complete callbacks are acknowledged with 204 even
        when signature/business validation fails; those callbacks never settle an order or grant credits.
        Gated customer catalog/create/status routes are available in the same PostgreSQL profile when TEST is
        explicitly enabled; payment-order history, missing-IPN reconciliation and chapter-unlock routes remain
        unavailable. There is no production payment and the feature flag remains off by default. Responds 204
        within the provider callback contract; response has no body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MomoTestPaymentNotification'
      responses:
        '204':
          description: Callback processed or acknowledged. Invalid signatures/business fields do not settle an order or grant credits. No body.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
        '400':
          description: Malformed JSON or missing/invalid typed notification fields.
        '413':
          description: Request body exceeds 16 KiB.
        '415':
          description: Content-Type must be application/json.
        '503':
          description: Notification could not be committed; provider may retry.
