        - publicationRightsPolicyAvailable
        - publicationRightsPolicyVersion
        - publicationRightsPolicyEffectiveAt
        - publicationRightsPolicyAcceptedAt
        - publicationContentVersion
        - readyChapterCount
        - currentRequestState
        - snapshotEtag
        - scopes
        - blockerCodes
      properties:
        workId:
          type: string
          format: uuid
        canSubmit:
          type: boolean
          description: True only when policy, ready chapter and pending-request gates currently pass.
        publicationRightsPolicyAvailable:
          type: boolean
        publicationRightsPolicyVersion:
          type: [string, 'null']
          maxLength: 64
        publicationRightsPolicyEffectiveAt:
