        readyForSubmission:
          type: boolean
        blockers:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [INCOMPLETE_MANUAL_EDITS, PENDING_REVIEW]
    TranslationReviewSubmissionResponse:
      type: object
      additionalProperties: false
      required: [submissionId, candidateId, status, snapshotDigest, segmentCount, submittedAt, replayed]
      properties:
        submissionId:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        status:
          type: string
          const: pending_review
        snapshotDigest:
          type: string
          pattern: '^[a-f0-9]{64}$'
        segmentCount:
          type: integer
          minimum: 1
          maximum: 5000
        submittedAt:
          type: string
          format: date-time
        replayed:
          type: boolean
    TranslationCandidatePreviewResponse:
      type: object
      additionalProperties: false
      required: [jobId, candidateId, sourceRevisionId, sourceRevisionCurrent, sourceLanguage, targetLanguage, providerId, candidateStatus, pageOffset, pageLimit, totalSegments, segments]
      properties:
        jobId:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        sourceRevisionId:
          type: string
          format: uuid
        sourceRevisionCurrent:
          type: boolean
          const: true
        sourceLanguage:
          type: string
        targetLanguage:
          type: string
        providerId:
          type: string
          const: fake-local
        candidateStatus:
          type: string
          const: ready_for_review
        pageOffset:
          type: integer
          minimum: 0
          maximum: 5000
        pageLimit:
          type: integer
          minimum: 1
          maximum: 25
        totalSegments:
          type: integer
          minimum: 1
          maximum: 5000
        segments:
          type: array
          maxItems: 25
          items:
            type: object
            additionalProperties: false
            required: [sourceSegmentId, ordinal, sourceType, sourceText, fakeResultText, editedText, editRevision, editEtag]
            properties:
              sourceSegmentId:
                type: string
                format: uuid
              ordinal:
                type: integer
                minimum: 1
                maximum: 5000
              sourceType:
                type: string
                enum: [paragraph, heading, quote]
              sourceText:
                type: string
                maxLength: 4000
              fakeResultText:
                type: string
                maxLength: 4016
                description: Identity-style source echo prefixed with an explicit fake-local marker; never a usable translation.
              editedText:
                type: [string, 'null']
                maxLength: 1048576
                description: Latest private writer correction, if one exists; never changes fakeResultText.
              editRevision:
                type: integer
                minimum: 0
                description: Zero means no writer correction has been saved.
              editEtag:
                type: string
                pattern: '^"edit-(0|[1-9][0-9]*)"$'
    TranslationCandidateEditResponse:
      type: object
      additionalProperties: false
      required: [jobId, candidateId, sourceSegmentId, editRevision, translatedText, createdAt, replayed]
      properties:
        jobId:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        sourceSegmentId:
          type: string
          format: uuid
        editRevision:
          type: integer
          minimum: 1
        translatedText:
          type: string
          maxLength: 1048576
          description: Plain text bounded by UTF-8 bytes at runtime.
        createdAt:
          type: string
          format: date-time
        replayed:
          type: boolean
    TranslationRetryResponse:
      type: object
      additionalProperties: false
      required: [jobId, jobStatus, retriedUnits, replayed, outboxEventId]
      properties:
        jobId:
          type: string
          format: uuid
        jobStatus:
          type: string
        retriedUnits:
          type: integer
          minimum: 0
        replayed:
          type: boolean
        outboxEventId:
          type: string
          format: uuid
    TranslationCancelResponse:
      type: object
      additionalProperties: false
      required: [jobId, jobStatus, cancelledUnits, cancelledAttempts, replayed, outboxEventId]
      properties:
        jobId:
          type: string
          format: uuid
        jobStatus:
          type: string
        cancelledUnits:
          type: integer
          minimum: 0
        cancelledAttempts:
          type: integer
          minimum: 0
        replayed:
          type: boolean
        outboxEventId:
          type: string
          format: uuid
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
        groups:
          type: array
          description: Health groups included by Spring Boot Actuator; component details are hidden.
          items:
            type: string
    ApiSystemStatus:
      type: object
      required: [apiVersion, environment, integrations, features]
      properties:
        apiVersion:
          type: string
          const: v1
        environment:
          type: string
          example: local
        integrations:
          type: object
          required: [googleOidcEnabled, momoTestEnabled, momoEnvironment]
          properties:
            googleOidcEnabled:
              type: boolean
              description: >-
                True when a plausible Google web client ID, secure credential callback URI, and
                32-byte rate-limit HMAC key are configured. This reports local configuration
                readiness; it does not verify reachability or credentials with Google.
            momoTestEnabled:
              type: boolean
              const: false
            momoEnvironment:
              type: string
              const: TEST
        features:
          type: object
          required: [importProcessingEnabled, cultivationEnabled, commerceSandboxEnabled, publicCatalogEnabled, publicationReleaseEnabled, translationFakePreviewEnabled, translationManualSubmissionEnabled]
          properties:
            importProcessingEnabled:
              type: boolean
              const: false
            cultivationEnabled:
              type: boolean
              const: false
            commerceSandboxEnabled:
              type: boolean
              const: false
            publicCatalogEnabled:
              type: boolean
              description: True only when the postgres profile, public catalog flag and valid server rate-limit configuration are active; does not attest rights or edge protection approval.
            publicationReleaseEnabled:
              type: boolean
              description: True only when the PostgreSQL profile and NOVEL_PUBLICATION_RELEASE_ENABLED are active; current owner, rights, approval and snapshot gates are still rechecked at publication time.
            translationFakePreviewEnabled:
              type: boolean
              description: True only when the postgres and translation-fake profiles and provider, API and worker opt-in flags are active.
            translationManualSubmissionEnabled:
              type: boolean
              description: >-
                True only when the fake preview is fully enabled and NOVEL_TRANSLATION_REVIEW_ENABLED is true.
                This advertises writer readiness/submission APIs only; reviewer queue, decisions and publication are
                not available yet and the flag must remain off outside local API verification.
    GoogleSignInBootstrap:
      type: object
      additionalProperties: false
      required: [clientId, loginUri, nonce, locale, attemptExpiresAt]
      properties:
        clientId:
          type: string
          description: Public Google Identity Services web client ID for this environment.
        loginUri:
          type: string
          format: uri
          description: Fixed backend callback URI; never supplied by the browser.
        nonce:
          type: string
          minLength: 16
          description: One-use nonce bound to the server-side sign-in attempt.
        locale:
          type: string
          example: vi
        attemptExpiresAt:
          type: string
          format: date-time
    GoogleCredentialForm:
      type: object
      additionalProperties: true
      required: [credential, g_csrf_token]
      properties:
        credential:
          type: string
          minLength: 1
          maxLength: 16384
          description: Google ID-token credential posted directly by GIS; discard after validation.
        g_csrf_token:
          type: string
          minLength: 1
          maxLength: 512
          description: Must exactly match the g_csrf_token cookie.
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token, expiresAt]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: HMAC-derived token bound to the current opaque app session; keep in memory only.
        expiresAt:
          type: string
          format: date-time
          description: Absolute session-expiry upper bound; idle session expiry can occur earlier.
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [user, identityProviders, policy, roles, features]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        identityProviders:
          type: array
          items:
            type: string
            enum: [google]
        policy:
          $ref: '#/components/schemas/UserPolicyState'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleScope'
        features:
          $ref: '#/components/schemas/UserFeatureFlags'
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, displayName, status]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        contactEmail:
          type: [string, 'null']
          format: email
        avatarUrl:
          type: [string, 'null']
          format: uri
        status:
          type: string
          enum: [active, pending, suspended]
    UserPolicyState:
      type: object
      additionalProperties: false
      required: [termsAcceptedVersion, privacyNoticeAcknowledgedVersion, requiredAcceptanceComplete]
      properties:
        termsAcceptedVersion:
          type: [string, 'null']
        privacyNoticeAcknowledgedVersion:
          type: [string, 'null']
        requiredAcceptanceComplete:
          type: boolean
    RoleScope:
      type: object
      additionalProperties: false
      description: >-
        Server-derived navigation/affordance scope for the current account. The security scope contains the reviewer
        administration capability only for an active system administrator. The publication scope contains
        publication.review only for a currently active assigned reviewer. Every protected API independently
        rechecks the role in PostgreSQL.
      required: [scope, permissions]
      properties:
        scope:
          type: string
          maxLength: 128
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            maxLength: 128
    UserFeatureFlags:
      type: object
