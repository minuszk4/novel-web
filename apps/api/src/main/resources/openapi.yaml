      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9._~-]{16,128}$'
      responses:
        '202':
          description: Eligible units were queued for another local attempt.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationRetryResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/translation/jobs/{jobId}/cancel:
    post:
      operationId: cancelFakeLocalTranslationJob
      tags: [Translation]
      x-implementation-status: local-preview
      summary: Cancel active fake-local translation work
      description: >-
        Atomically cancels queued/running/retry-wait units, ends fake-local running attempts and clears leases.
        A late worker completion is fenced before candidate writes. If completion wins the row lock first and the
        job reaches review_required, cancellation is rejected. Real provider cancellation/refund is not supported.
        Requires writable library access, current Terms/Privacy acceptance and session-bound CSRF.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9._~-]{16,128}$'
      responses:
        '200':
          description: The active local job was cancelled or the same cancellation was replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationCancelResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    appSession:
      type: apiKey
      in: cookie
      name: __Host-novel_session
      description: Opaque, rotated, host-only session cookie with Secure, HttpOnly, SameSite=Lax and Path=/ attributes.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Short-lived synchronizer token returned by GET /api/v1/auth/csrf; held by the browser in memory.
  headers:
    ReaderAnnotationETag:
      description: Strong entity tag derived from the annotation version; send it verbatim in If-Match for updates.
      schema:
        type: string
        pattern: '^"annotation-[1-9][0-9]*"$'
  schemas:
    CreateManuscriptRequest:
      type: object
      additionalProperties: false
      required: [title, language]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        author:
          type: string
          maxLength: 200
          default: ''
        language:
          type: string
          minLength: 2
          maxLength: 35
          example: vi
    CreateDraftChapterRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
          description: Trimmed by the server; Unicode code point count must be 1–300.
    CreatedDraftChapter:
      type: object
      additionalProperties: false
      required: [id, workId, ordinal, title, language, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workId:
          type: string
          format: uuid
        ordinal:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 300
        language:
          type: string
          minLength: 2
          maxLength: 35
        status:
          type: string
          const: draft
        createdAt:
          type: string
          format: date-time
    AuthoringChapterOutlinePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AuthoringChapterOutlineItem'
        nextCursor:
          type: [string, 'null']
          maxLength: 2048
          description: Signed actor/manuscript/endpoint cursor, or null when there is no next page.
    AuthoringManuscriptListPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AuthoringManuscriptListItem'
        nextCursor:
          type: [string, 'null']
          maxLength: 2048
          description: Signed actor/endpoint cursor, or null when there is no next page.
    AuthoringManuscriptListItem:
      type: object
      additionalProperties: false
      required: [id, title, author, language, visibility, publicationState, chapterCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 300
        author:
          type: string
          maxLength: 200
        language:
          type: string
          minLength: 2
          maxLength: 35
        visibility:
          type: string
          const: private
        publicationState:
          type: string
          const: draft
        chapterCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    AuthoringManuscriptDetails:
      type: object
      additionalProperties: false
      required:
        [id, title, author, language, visibility, publicationState, chapterCount, createdAt, metadataVersion]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 300
        author:
          type: string
          maxLength: 200
        language:
          type: string
          minLength: 2
          maxLength: 35
        visibility:
          type: string
          const: private
        publicationState:
          type: string
          const: draft
        chapterCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        metadataVersion:
          type: integer
          format: int64
          minimum: 1
    AuthoringManuscriptMetadataUpdate:
      type: object
      additionalProperties: false
      required: [title, author, language]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
          description: Trimmed by the server; Unicode code point count must be 1–300.
        author:
          type: string
          maxLength: 200
          description: Empty string clears the optional pen name/byline.
        language:
          type: string
          minLength: 2
          maxLength: 35
    AuthoringChapterOutlineItem:
      type: object
      additionalProperties: false
      required: [id, ordinal, title, language, status, contentAvailable, hasSavedDraftContent, createdAt]
      properties:
        id:
          type: string
          format: uuid
        ordinal:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 300
        language:
          type: string
          minLength: 2
          maxLength: 35
        status:
          type: string
          enum: [draft, ready, unavailable]
        contentAvailable:
          type: boolean
          description: True only when a ready chapter has a current source revision; authored drafts can have saved revisions and remain false.
        hasSavedDraftContent:
          type: boolean
          description: True when this draft has a saved revision; only a never-saved empty draft can be removed from the outline.
        createdAt:
          type: string
          format: date-time
    SavePrivateDraftRevisionRequest:
      type: object
      additionalProperties: false
      required: [sourceFormat, normalizedContent, segments]
      properties:
        sourceFormat:
          type: string
          enum: [plain_text, markdown, xhtml, epub_xhtml]
        normalizedContent:
          type: string
          minLength: 1
          maxLength: 10485760
          description: Complete normalized chapter body; maximum 10 MiB when encoded as UTF-8.
        segments:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/PrivateDraftSegmentInput'
    PrivateDraftSegmentInput:
      type: object
      additionalProperties: false
      required: [ordinal, type, sourceText, stableAnchor]
      properties:
        ordinal:
          type: integer
          minimum: 1
          description: Must be contiguous and begin at one.
        type:
          type: string
          enum: [paragraph, heading, quote, image_ref]
        sourceText:
          type: string
          maxLength: 1048576
          description: Maximum 1 MiB UTF-8 per segment and 10 MiB across all segments.
        stableAnchor:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$'
    PrivateAuthoredDraft:
      type: object
      additionalProperties: false
      required: [id, workId, title, status, revisionNo, sourceFormat, normalizedContent, segments, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 300
        status:
          type: string
          const: draft
        revisionNo:
          type: integer
          minimum: 0
        sourceFormat:
          type: [string, 'null']
          enum: [plain_text, markdown, xhtml, epub_xhtml, null]
        normalizedContent:
          type: string
          maxLength: 10485760
        segments:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/PrivateDraftSegment'
        updatedAt:
          type: string
          format: date-time
    PrivateDraftSegment:
      allOf:
        - $ref: '#/components/schemas/PrivateDraftSegmentInput'
      description: Owner-visible segment snapshot; checksum and internal revision identifiers are omitted.
    CreatedPrivateDraftRevision:
      type: object
      additionalProperties: false
      required: [id, chapterId, revisionNo, sourceFormat, createdAt]
      properties:
        id:
          type: string
          format: uuid
        chapterId:
          type: string
          format: uuid
        revisionNo:
          type: integer
          minimum: 1
        sourceFormat:
          type: string
          enum: [plain_text, markdown, xhtml, epub_xhtml]
        createdAt:
          type: string
          format: date-time
    CreatedManuscript:
      type: object
      additionalProperties: false
      required: [id, title, author, language, publicationState, visibility, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 300
        author:
          type: string
          maxLength: 200
        language:
          type: string
          maxLength: 35
        publicationState:
          type: string
          const: draft
        visibility:
          type: string
          const: private
        createdAt:
          type: string
          format: date-time
    TranslationEnqueueRequest:
      type: object
      additionalProperties: false
      required: [chapterId, sourceRevisionId, targetLanguage]
      properties:
        chapterId:
          type: string
          format: uuid
        sourceRevisionId:
          type: string
          format: uuid
        targetLanguage:
          type: string
          minLength: 2
          maxLength: 35
          example: en
    TranslationEnqueueResponse:
      type: object
      additionalProperties: false
      required: [jobId, status, chapterId, sourceRevisionId, sourceLanguage, targetLanguage, providerId, totalUnits, replayed]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, preparing, translating, retry_wait, review_required, completed, failed, cancel_requested, cancelled]
        chapterId:
          type: string
          format: uuid
        sourceRevisionId:
          type: string
          format: uuid
        sourceLanguage:
          type: string
        targetLanguage:
          type: string
        providerId:
          type: string
          const: fake-local
        totalUnits:
          type: integer
          minimum: 1
        replayed:
          type: boolean
    TranslationJobStatusResponse:
      type: object
      additionalProperties: false
      required: [job, terminalUnits, progressPercent]
      properties:
        terminalUnits:
          type: integer
          minimum: 0
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
        job:
          type: object
          additionalProperties: false
          required: [id, workId, chapterId, sourceRevisionId, sourceRevisionCurrent, workTitle, chapterTitle, chapterOrdinal, canManage, sourceLanguage, targetLanguage, providerId, status, totalUnits, completedUnits, failedUnits, queuedUnits, runningUnits, retryWaitUnits, cancelledUnits, failureCode, candidateId, candidateStatus, createdAt, updatedAt, startedAt, completedAt, cancelRequestedAt]
          properties:
            id:
              type: string
              format: uuid
            workId:
              type: string
              format: uuid
            chapterId:
              type: string
              format: uuid
            sourceRevisionId:
              type: string
              format: uuid
            sourceRevisionCurrent:
              type: boolean
              description: True only when the job's source revision is the chapter's current ready revision. A stale revision must not be retried.
            workTitle:
              type: string
            chapterTitle:
              type: string
            chapterOrdinal:
              type: integer
              minimum: 1
            canManage:
              type: boolean
            sourceLanguage:
              type: string
            targetLanguage:
              type: string
            providerId:
              type: string
              const: fake-local
            status:
              type: string
              enum: [queued, preparing, translating, validating, retry_wait, review_required, completed, failed, cancel_requested, cancelled]
            totalUnits:
              type: integer
              minimum: 0
            completedUnits:
              type: integer
              minimum: 0
            failedUnits:
              type: integer
              minimum: 0
            queuedUnits:
              type: integer
              minimum: 0
            runningUnits:
              type: integer
              minimum: 0
            retryWaitUnits:
              type: integer
              minimum: 0
            cancelledUnits:
              type: integer
              minimum: 0
            failureCode:
              type: [string, 'null']
            candidateId:
              type: [string, 'null']
              format: uuid
            candidateStatus:
              anyOf:
