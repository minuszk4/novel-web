      properties:
        jobId:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        sourceRevisionId:
          type: string
          format: uuid
        sourceRevisionCurrent:
          type: boolean
          const: true
        sourceLanguage:
          type: string
        targetLanguage:
          type: string
        editedSegments:
          type: integer
          minimum: 0
          maximum: 5000
        totalSegments:
          type: integer
          minimum: 1
          maximum: 5000
        missingSegmentOrdinals:
          type: array
          maxItems: 5000
          items:
            type: integer
            minimum: 1
            maximum: 5000
        pendingReview:
          type: boolean
        snapshotDigest:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
