          format: uuid
        revisionId:
          type: string
          format: uuid
        matchedText:
          type: string
          maxLength: 512
        targetTerm:
          type: [string, 'null']
          maxLength: 4096
        startUtf16:
          type: integer
          minimum: 0
        endUtf16:
          type: integer
          minimum: 0
        alias:
          type: boolean
        doNotTranslate:
          type: boolean
        scope:
          type: string
          enum: [USER_GLOBAL, LIBRARY, WORK, VOLUME, CHAPTER]
        priority:
          type: integer
          minimum: -1000000
