  /api/v1/imports/{importId}/parse:
    post:
      operationId: startPrivateImportParse
      tags: [Library]
      x-implementation-status: implemented
      summary: Verify an uploaded object and enqueue private parsing
      description: >-
        Verifies owner access, staged-object availability and the accepted size/SHA-256 before queuing a durable
        PostgreSQL parser job. A separate worker rechecks the digest and content safety bounds, parses outside the
        request transaction and atomically stores a bounded private EPUB 3, UTF-8 TXT, single-document HTML or Markdown preview,
        based on the uploaded extension and immutable parser version. TXT becomes one chapter and emits TXT_SINGLE_CHAPTER;
        HTML becomes one chapter, strips active/non-content markup without executing or fetching it, and emits HTML_SINGLE_DOCUMENT.
        Markdown uses CommonMark 0.32.0 core without GFM extensions, supports strict UTF-8 Markdown files up to 16 MiB,
        removes raw HTML and link destinations, keeps link labels/image alt text and uses the shallowest repeated top-level
        heading level as chapter boundaries. A leading shallower heading supplies the work title and preamble text becomes
        an opening chapter. Without repeated headings the document remains one chapter and emits MARKDOWN_SINGLE_DOCUMENT.
        Formatting normalization emits MARKDOWN_FORMATTING_NORMALIZED. Processing bounds include 30 seconds, 50,000 AST
        nodes, depth 128, 2,000 chapters, 5,000 segments, 4,000 code points/16 KiB per segment, 384 KiB of normalized text
        and a 1 MiB serialized preview.
        Repeated calls for one import
        return the same parse state. Does not publish or commit a work. Preview data is deleted when the staging
        import expires.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
