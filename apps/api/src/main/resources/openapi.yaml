  /api/v1/authoring/manuscripts/{workId}/chapters/{chapterId}/revisions:
    post:
      operationId: createPrivateAuthoredDraftRevision
      tags: [Authoring]
      x-implementation-status: implemented-postgres-profile
      summary: Save a complete immutable private draft revision
      description: >-
        Atomically appends a complete revision and ordered segments to an eligible private authored draft chapter.
        The revision is immutable; the chapter's current revision pointer advances while status stays draft, so Reader
        and public catalog routes continue to hide it. Requires an active session, current Terms/Privacy acceptance,
        session-bound CSRF, a strong If-Match ETag from the draft read route, and a 16–128 character Idempotency-Key.
        A stale ETag returns 412 with currentEtag. Replaying the same key and complete request returns the original
        revision even after a later save; reusing that key for another request returns 409. Unknown JSON properties
        are rejected. Content is limited to 10 MiB UTF-8, with at most 10,000 ordered segments and 10 MiB aggregate
        segment text.
      security:
        - appSession: []
          csrfToken: []
      parameters:
        - name: workId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          description: Strong current draft ETag from GET .../draft, such as "draft-0".
          schema:
            type: string
            pattern: '^"draft-(0|[1-9][0-9]*)"$'
        - name: Idempotency-Key
          in: header
          required: true
          description: Reuse the exact key and complete request after an uncertain result.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9._~-]{16,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePrivateDraftRevisionRequest'
      responses:
        '201':
          description: New immutable draft revision; chapter remains private and in draft status.
          headers:
            ETag:
              schema:
                type: string
                pattern: '^"draft-[1-9][0-9]*"$'
            Cache-Control:
              schema:
                type: string
                const: no-store
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedPrivateDraftRevision'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: Idempotency-Key collision or duplicate immutable normalized revision content.
          content:
