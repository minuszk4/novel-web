          format: uuid
        workTitle:
          type: string
          maxLength: 300
        chapterTitle:
          type: string
          maxLength: 300
        sourceLanguage:
          type: string
          maxLength: 35
        targetLanguage:
          type: string
          maxLength: 35
        segmentCount:
          type: integer
          minimum: 1
          maximum: 5000
        submitterDisplayName:
          type: string
          maxLength: 200
        submittedAt:
          type: string
          format: date-time
        sourceCurrent:
          type: boolean
    TranslationReviewDetail:
      type: object
      additionalProperties: false
      required: [submissionId, status, workTitle, chapterTitle, submitterDisplayName, sourceLanguage, targetLanguage, snapshotDigest, segmentCount, submittedAt, canDecide, segments]
      properties:
        submissionId:
          type: string
          format: uuid
        status:
          type: string
