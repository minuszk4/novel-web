            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            startedAt:
              type: [string, 'null']
              format: date-time
            completedAt:
              type: [string, 'null']
              format: date-time
            cancelRequestedAt:
              type: [string, 'null']
              format: date-time
    TranslationJobListResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
