        removes raw HTML and link destinations, keeps link labels/image alt text and uses the shallowest repeated top-level
        heading level as chapter boundaries. A leading shallower heading supplies the work title and preamble text becomes
        an opening chapter. Without repeated headings the document remains one chapter and emits MARKDOWN_SINGLE_DOCUMENT.
