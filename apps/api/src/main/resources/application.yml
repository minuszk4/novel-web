spring:
  application:
    name: novel-web-api
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:true}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

novel:
  environment: ${NOVEL_ENVIRONMENT:local}
  features:
    cultivation-enabled: ${NOVEL_FEATURE_CULTIVATION_ENABLED:false}
    commerce-sandbox-enabled: ${NOVEL_FEATURE_COMMERCE_SANDBOX_ENABLED:false}
    public-catalog-enabled: ${NOVEL_FEATURE_PUBLIC_CATALOG_ENABLED:false}
  public-catalog:
    rate-limit:
      hmac-key: ${NOVEL_PUBLIC_CATALOG_RATE_LIMIT_HMAC_KEY:}
      trusted-proxies: ${NOVEL_PUBLIC_CATALOG_TRUSTED_PROXIES:}
      capacity: ${NOVEL_PUBLIC_CATALOG_RATE_LIMIT_CAPACITY:60}
      refill-interval: ${NOVEL_PUBLIC_CATALOG_RATE_LIMIT_REFILL_INTERVAL:1s}
      cleanup-delay: ${NOVEL_PUBLIC_CATALOG_RATE_LIMIT_CLEANUP_DELAY:1h}
  publication:
    release-enabled: ${NOVEL_PUBLICATION_RELEASE_ENABLED:false}
    scheduler:
      api-enabled: ${NOVEL_PUBLICATION_SCHEDULER_API_ENABLED:false}
      worker-enabled: ${NOVEL_PUBLICATION_SCHEDULER_WORKER_ENABLED:false}
      poll-delay: ${NOVEL_PUBLICATION_SCHEDULER_POLL_DELAY:15s}
    purge:
      worker-enabled: ${NOVEL_PUBLICATION_PURGE_WORKER_ENABLED:false}
      required-targets: ${NOVEL_PUBLICATION_PURGE_REQUIRED_TARGETS:}
      batch-size: ${NOVEL_PUBLICATION_PURGE_BATCH_SIZE:5}
      poll-delay: ${NOVEL_PUBLICATION_PURGE_POLL_DELAY:30s}
      targets:
        cdn:
          endpoint: ${NOVEL_PUBLICATION_PURGE_CDN_ENDPOINT:}
          bearer-token: ${NOVEL_PUBLICATION_PURGE_CDN_TOKEN:}
        search-index:
          endpoint: ${NOVEL_PUBLICATION_PURGE_SEARCH_INDEX_ENDPOINT:}
          bearer-token: ${NOVEL_PUBLICATION_PURGE_SEARCH_INDEX_TOKEN:}
        feed-cache:
          endpoint: ${NOVEL_PUBLICATION_PURGE_FEED_CACHE_ENDPOINT:}
          bearer-token: ${NOVEL_PUBLICATION_PURGE_FEED_CACHE_TOKEN:}
        signed-links:
          endpoint: ${NOVEL_PUBLICATION_PURGE_SIGNED_LINKS_ENDPOINT:}
          bearer-token: ${NOVEL_PUBLICATION_PURGE_SIGNED_LINKS_TOKEN:}
  translation:
    fake:
      enabled: ${NOVEL_TRANSLATION_FAKE_ENABLED:false}
      api-enabled: ${NOVEL_TRANSLATION_FAKE_API_ENABLED:false}
    review:
      enabled: ${NOVEL_TRANSLATION_REVIEW_ENABLED:false}
    publication:
      enabled: ${NOVEL_TRANSLATION_PUBLICATION_ENABLED:false}
  payment:
    momo:
      test:
        enabled: ${NOVEL_MOMO_TEST_ENABLED:false}
        environment: ${MOMO_ENV:}
        partner-code: ${MOMO_TEST_PARTNER_CODE:}
        access-key: ${MOMO_TEST_ACCESS_KEY:}
        secret-key: ${MOMO_TEST_SECRET_KEY:}
        base-url: ${MOMO_TEST_BASE_URL:}
        ipn-url: ${MOMO_TEST_IPN_URL:}
        redirect-url: ${MOMO_TEST_REDIRECT_URL:}
        reconciliation:
          enabled: ${NOVEL_MOMO_TEST_RECONCILIATION_ENABLED:false}
          poll-delay: ${NOVEL_MOMO_TEST_RECONCILIATION_POLL_DELAY:30s}
          batch-size: ${NOVEL_MOMO_TEST_RECONCILIATION_BATCH_SIZE:5}
  account-data-export:
    enabled: ${NOVEL_ACCOUNT_DATA_EXPORT_ENABLED:false}
    worker-enabled: ${NOVEL_ACCOUNT_DATA_EXPORT_WORKER_ENABLED:false}
    root: ${NOVEL_ACCOUNT_EXPORT_ROOT:${java.io.tmpdir}/novel-web-account-exports}
    max-artifact-bytes: ${NOVEL_ACCOUNT_EXPORT_MAX_BYTES:268435456}
    max-uncompressed-bytes: ${NOVEL_ACCOUNT_EXPORT_MAX_UNCOMPRESSED_BYTES:1073741824}
    artifact-ttl: ${NOVEL_ACCOUNT_EXPORT_TTL:24h}
    recent-authentication-window: ${NOVEL_ACCOUNT_EXPORT_RECENT_AUTH:10m}
    poll-delay: ${NOVEL_ACCOUNT_EXPORT_POLL_DELAY:30s}
    cleanup-delay: ${NOVEL_ACCOUNT_EXPORT_CLEANUP_DELAY:5m}
    batch-size: ${NOVEL_ACCOUNT_EXPORT_BATCH_SIZE:3}
  workspaces:
    invitations:
      enabled: ${NOVEL_WORKSPACE_INVITATIONS_ENABLED:false}
      worker-enabled: ${NOVEL_WORKSPACE_INVITATION_WORKER_ENABLED:false}
      signing-key: ${NOVEL_WORKSPACE_INVITATION_SIGNING_KEY:}
      app-base-url: ${NOVEL_APP_BASE_URL:http://localhost:4200}
      sender-address: ${NOVEL_MAIL_FROM:}
      ttl: ${NOVEL_WORKSPACE_INVITATION_TTL:7d}
      poll-delay: ${NOVEL_WORKSPACE_INVITATION_POLL_DELAY:PT15S}
  authoring:
    collaboration:
      enabled: ${NOVEL_AUTHORING_COLLABORATION_ENABLED:false}
      invitation-worker-enabled: ${NOVEL_AUTHORING_COLLABORATION_INVITATION_WORKER_ENABLED:false}
      ttl: ${NOVEL_AUTHORING_COLLABORATION_INVITATION_TTL:7d}
      poll-delay: ${NOVEL_AUTHORING_COLLABORATION_INVITATION_POLL_DELAY:PT15S}
  web:
    cors:
      allowed-origins:
        - http://localhost:4200
        - http://127.0.0.1:4200
  imports:
    parser:
      poll-delay: ${NOVEL_IMPORT_PARSER_POLL_DELAY:1s}
    staging:
      root: ${NOVEL_IMPORT_STAGING_ROOT:${java.io.tmpdir}/novel-web-import-staging}
      max-upload-bytes: ${NOVEL_IMPORT_MAX_UPLOAD_BYTES:52428800}
      upload-target-ttl: ${NOVEL_IMPORT_TARGET_TTL:15m}
      job-ttl: ${NOVEL_IMPORT_JOB_TTL:24h}
      max-archive-entries: ${NOVEL_IMPORT_MAX_ARCHIVE_ENTRIES:1000}
      max-archive-entry-bytes: ${NOVEL_IMPORT_MAX_ARCHIVE_ENTRY_BYTES:52428800}
      max-archive-expanded-bytes: ${NOVEL_IMPORT_MAX_ARCHIVE_EXPANDED_BYTES:104857600}
      max-archive-compression-ratio: ${NOVEL_IMPORT_MAX_ARCHIVE_COMPRESSION_RATIO:100.0}
      max-archive-depth: ${NOVEL_IMPORT_MAX_ARCHIVE_DEPTH:32}
      validation-timeout: ${NOVEL_IMPORT_VALIDATION_TIMEOUT:15s}
      cleanup-delay: ${NOVEL_IMPORT_CLEANUP_DELAY:1m}
      cleanup-batch-size: ${NOVEL_IMPORT_CLEANUP_BATCH_SIZE:100}
      max-active-jobs-per-user: ${NOVEL_IMPORT_MAX_ACTIVE_JOBS_PER_USER:5}
      max-active-declared-bytes-per-user: ${NOVEL_IMPORT_MAX_ACTIVE_DECLARED_BYTES_PER_USER:104857600}
      create-rate-limit-capacity: ${NOVEL_IMPORT_CREATE_RATE_LIMIT_CAPACITY:10}
      create-rate-limit-refill-interval: ${NOVEL_IMPORT_CREATE_RATE_LIMIT_REFILL_INTERVAL:6s}
      upload-rate-limit-capacity: ${NOVEL_IMPORT_UPLOAD_RATE_LIMIT_CAPACITY:5}
      upload-rate-limit-refill-interval: ${NOVEL_IMPORT_UPLOAD_RATE_LIMIT_REFILL_INTERVAL:10s}
      rate-limit-retention: ${NOVEL_IMPORT_RATE_LIMIT_RETENTION:24h}
