spring:
  application:
    name: novel-web-api
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

novel:
  environment: ${NOVEL_ENVIRONMENT:local}
  features:
    cultivation-enabled: ${NOVEL_FEATURE_CULTIVATION_ENABLED:false}
  web:
    cors:
      allowed-origins:
        - http://localhost:4200
        - http://127.0.0.1:4200
  imports:
    parser:
      poll-delay: ${NOVEL_IMPORT_PARSER_POLL_DELAY:1s}
    staging:
      root: ${NOVEL_IMPORT_STAGING_ROOT:${java.io.tmpdir}/novel-web-import-staging}
      max-upload-bytes: ${NOVEL_IMPORT_MAX_UPLOAD_BYTES:52428800}
      upload-target-ttl: ${NOVEL_IMPORT_TARGET_TTL:15m}
      job-ttl: ${NOVEL_IMPORT_JOB_TTL:24h}
      max-archive-entries: ${NOVEL_IMPORT_MAX_ARCHIVE_ENTRIES:1000}
      max-archive-entry-bytes: ${NOVEL_IMPORT_MAX_ARCHIVE_ENTRY_BYTES:52428800}
      max-archive-expanded-bytes: ${NOVEL_IMPORT_MAX_ARCHIVE_EXPANDED_BYTES:104857600}
      max-archive-compression-ratio: ${NOVEL_IMPORT_MAX_ARCHIVE_COMPRESSION_RATIO:100.0}
      max-archive-depth: ${NOVEL_IMPORT_MAX_ARCHIVE_DEPTH:32}
      validation-timeout: ${NOVEL_IMPORT_VALIDATION_TIMEOUT:15s}
      cleanup-delay: ${NOVEL_IMPORT_CLEANUP_DELAY:1m}
      cleanup-batch-size: ${NOVEL_IMPORT_CLEANUP_BATCH_SIZE:100}
      max-active-jobs-per-user: ${NOVEL_IMPORT_MAX_ACTIVE_JOBS_PER_USER:5}
      max-active-declared-bytes-per-user: ${NOVEL_IMPORT_MAX_ACTIVE_DECLARED_BYTES_PER_USER:104857600}
      create-rate-limit-capacity: ${NOVEL_IMPORT_CREATE_RATE_LIMIT_CAPACITY:10}
      create-rate-limit-refill-interval: ${NOVEL_IMPORT_CREATE_RATE_LIMIT_REFILL_INTERVAL:6s}
      upload-rate-limit-capacity: ${NOVEL_IMPORT_UPLOAD_RATE_LIMIT_CAPACITY:5}
      upload-rate-limit-refill-interval: ${NOVEL_IMPORT_UPLOAD_RATE_LIMIT_REFILL_INTERVAL:10s}
      rate-limit-retention: ${NOVEL_IMPORT_RATE_LIMIT_RETENTION:24h}
