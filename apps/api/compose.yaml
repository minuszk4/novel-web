name: novel-web-local

services:
  postgres:
    image: postgres:17-alpine
    profiles: [database]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-novelweb}
      POSTGRES_USER: ${POSTGRES_USER:-novelweb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set a local password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - novel_web_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    shm_size: 64mb
    mem_limit: 512m
    cpus: 1.0

volumes:
  novel_web_postgres_data:
