name: novel-web-local

services:
  postgres:
    image: postgres:17-alpine
    profiles: [database, full-stack]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-novelweb}
      POSTGRES_USER: ${POSTGRES_USER:-novelweb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set a local password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - novel_web_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    shm_size: 64mb
    mem_limit: 512m
    cpus: 1.0

  api:
    profiles: [full-stack]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-novelweb}
      DATABASE_USERNAME: ${POSTGRES_USER:-novelweb}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in apps/api/.env}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-5}
      NOVEL_ENVIRONMENT: local-docker
      NOVEL_APP_BASE_URL: ${STACK_GOOGLE_CALLBACK_ORIGIN:-http://localhost:8088}
      FIREBASE_AUTH_API_KEY: ${FIREBASE_AUTH_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_AUTH_PROJECT_ID: ${FIREBASE_AUTH_PROJECT_ID:-}
      FIREBASE_AUTH_APP_ID: ${FIREBASE_AUTH_APP_ID:-}
      NOVEL_WEB_CORS_ALLOWED_ORIGINS: ${STACK_CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://localhost:4200,http://127.0.0.1:4200}
      NOVEL_IMPORT_STAGING_ROOT: /var/lib/novel/import-staging
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=10001,gid=10001,mode=1777
    volumes:
      - novel_web_import_staging_data:/var/lib/novel/import-staging
    mem_limit: 1g
    cpus: 2.0

  web:
    profiles: [full-stack]
    build:
      context: ../web
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
    environment:
      API_UPSTREAM: http://api:8080
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=0755
      - /var/cache/nginx:rw,noexec,nosuid,size=8m,uid=101,gid=101,mode=0755
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 128m
    cpus: 0.5

volumes:
  novel_web_postgres_data:
  novel_web_import_staging_data:
